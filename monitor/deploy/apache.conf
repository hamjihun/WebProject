# Apache httpd: /monitor/ 경로로 수집기를 노출
# 필요 모듈: a2enmod proxy proxy_http   (CentOS: mod_proxy, mod_proxy_http 기본 포함)
# VirtualHost 안에 추가 후 재시작

ProxyPreserveHost On
ProxyPass        /monitor/ http://127.0.0.1:8787/
ProxyPassReverse /monitor/ http://127.0.0.1:8787/
RedirectMatch 301 ^/monitor$ /monitor/
