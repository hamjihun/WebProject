<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IMS 삽입 예시</title>
<style>
  body { font-family:"Malgun Gothic",sans-serif; margin:0; background:#f1f5f9; }
  .ims-header { background:#1e3a8a; color:#fff; padding:12px 20px; font-weight:700; }
  .ims-body { padding:20px; }
  .tiles { display:flex; gap:12px; margin-bottom:16px; }
  .tile { background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:12px 16px; min-width:140px; }
  .tile b { display:block; font-size:24px; }
  .tile.bad b { color:#ef4444; }
  iframe { width:100%; height:720px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; }
</style>
</head>
<body>
<div class="ims-header">IMS &gt; 시스템관리 &gt; 서버 모니터링</div>
<div class="ims-body">

  <!-- 방법 1: API 로 요약값만 가져와서 IMS 스타일로 직접 그리기 -->
  <div class="tiles" id="tiles"></div>

  <!-- 방법 2: 대시보드 전체를 iframe 으로 삽입 (embed=1: 헤더 숨김, theme=light: 밝은 배경) -->
  <iframe src="/monitor/?embed=1&theme=light"></iframe>

</div>
<script>
  // 같은 도메인 /monitor/ 로 프록시된 경우. 별도 포트를 쓰면 'http://IMS서버:8787/api/servers' 로 바꾸세요.
  const API = '/monitor/api/servers';
  async function tiles() {
    const r = await fetch(API); const j = await r.json();
    const s = j.servers, off = s.filter(x => !x.online).length;
    const warn = s.filter(x => x.online && (x.cpu >= 90 || x.mem_pct >= 90 || (x.disks || []).some(d => d.pct >= 90))).length;
    document.getElementById('tiles').innerHTML =
      `<div class="tile">전체 서버<b>${s.length}</b></div>` +
      `<div class="tile ${off ? 'bad' : ''}">오프라인<b>${off}</b></div>` +
      `<div class="tile ${warn ? 'bad' : ''}">임계치 초과<b>${warn}</b></div>`;
  }
  tiles(); setInterval(tiles, 10000);
</script>
</body>
</html>
