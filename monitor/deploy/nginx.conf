# nginx: IMS 도메인 아래 /monitor/ 경로로 수집기를 노출 (사용자는 IMS 포트만 사용)
# 기존 server { ... } 블록 안에 아래 location 두 개를 추가하고 nginx -s reload
#
#   http://ims.example.co.kr/monitor/            -> 대시보드
#   http://ims.example.co.kr/monitor/api/servers -> API (IMS 화면에서 fetch)
#   에이전트 전송 주소: http://ims.example.co.kr/monitor/api/metrics

location = /monitor { return 301 /monitor/; }
location /monitor/ {
    proxy_pass         http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;     # 수집기가 에이전트 IP를 알 수 있게
    proxy_read_timeout 30s;
}
