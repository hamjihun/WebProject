<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; }
  .box { width:380px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 26px 24px; }
  h1 { font-size:19px; margin:0 0 6px; } .sub { color:var(--muted); font-size:12.5px; line-height:1.6; margin-bottom:18px; }
  .notice { background:rgba(56,189,248,.12); border:1px solid var(--accent); border-radius:9px; padding:10px 13px; font-size:12.5px; line-height:1.6; margin-bottom:18px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; }
  input[type=password] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:20px; background:var(--accent); color:#0f172a; border:0; border-radius:8px; padding:11px; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-size:12px; min-height:16px; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .foot { margin-top:16px; text-align:center; font-size:12px; } .foot a { color:var(--muted); }
</style>
</head>
<body>
<form class="box" id="f">
  <h1>비밀번호 변경</h1>
  <div class="sub" id="who"></div>
  <div class="notice" id="notice" hidden>처음 로그인하셨습니다. 안전을 위해 비밀번호를 본인만 아는 값으로 바꿔 주세요. 바꾸기 전에는 다른 화면을 열 수 없습니다.</div>
  <label for="o">지금 쓰는 비밀번호</label>
  <input type="password" id="o" autocomplete="current-password" autofocus>
  <label for="n1">새 비밀번호 <span style="font-size:11px">(4자 이상 · 아이디와 같을 수 없음)</span></label>
  <input type="password" id="n1" autocomplete="new-password">
  <label for="n2">새 비밀번호 확인</label>
  <input type="password" id="n2" autocomplete="new-password">
  <button type="submit" id="b">바꾸기</button>
  <div class="msg" id="msg"></div>
  <div class="foot" id="foot" hidden><a href="home.html">그냥 홈으로 돌아가기</a></div>
</form>
<script>
const $ = (s) => document.querySelector(s);
(async () => {
  const r = await fetch('api/me');
  if (r.status === 401) { location.href = 'login.html'; return; }
  const j = await r.json();
  $('#who').textContent = `${j.user.name} (${j.user.id}) 계정의 비밀번호를 바꿉니다.`;
  $('#notice').hidden = !j.user.must_change;
  $('#foot').hidden = !!j.user.must_change;
})();
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  const m = $('#msg'); m.className = 'msg';
  if ($('#n1').value !== $('#n2').value) { m.className = 'msg err'; m.textContent = '새 비밀번호 두 개가 서로 다릅니다'; $('#n2').focus(); return; }
  const b = $('#b'); b.disabled = true; b.textContent = '바꾸는 중...';
  try {
    const r = await fetch('api/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ old: $('#o').value, new: $('#n1').value }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '바꾸지 못했습니다');
    m.className = 'msg ok'; m.textContent = '바꿨습니다. 잠시 후 홈 화면으로 이동합니다.';
    setTimeout(() => { location.href = 'home.html'; }, 900);
  } catch (err) {
    m.className = 'msg err'; m.textContent = err.message;
    b.disabled = false; b.textContent = '바꾸기';
  }
};
</script>
</body>
</html>
