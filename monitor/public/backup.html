<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>백업 현황</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --warn:#fab219; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:13px; }
  .wrap { padding:16px 20px 40px; max-width:1600px; margin:0 auto; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
  .bar button, .bar select { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  .bar button.on { background:var(--accent); color:#0f172a; font-weight:700; border-color:var(--accent); }
  .bar h1 { font-size:18px; margin:0 6px; min-width:130px; text-align:center; }
  .legend { display:flex; gap:14px; margin-left:auto; color:var(--muted); font-size:12px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:-2px; margin-right:4px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .l { color:var(--muted); font-size:12px; } .kpi .v { font-size:26px; font-weight:700; margin-top:4px; } .kpi .v small { font-size:13px; color:var(--muted); font-weight:400; margin-left:4px; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:4px; }
  .kpi.ok .v { color:var(--ok); } .kpi.warn .v { color:var(--warn); } .kpi.bad .v { color:var(--bad); }
  .p { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .p h2 { font-size:15px; margin:0 0 10px; } .p h2 small { color:var(--muted); font-weight:400; font-size:12px; margin-left:8px; }
  .tw { overflow-x:auto; }
  table.mx { border-collapse:separate; border-spacing:0; font-size:12px; white-space:nowrap; }
  .mx th, .mx td { padding:0; border-bottom:1px solid var(--line); }
  .mx th { color:var(--muted); font-weight:400; font-size:11px; text-align:center; padding:4px 0 6px; }
  .mx th.d.we { color:#f87171; } .mx th.d.today { color:var(--accent); font-weight:700; }
  .mx th.d span { display:block; font-size:10px; }
  .mx td.n, .mx th.n { text-align:left; padding:6px 10px 6px 4px; position:sticky; left:0; background:var(--card); z-index:1; min-width:210px; }
  .mx tr.g td { background:rgba(148,163,184,.08); font-weight:700; padding:6px 4px; color:var(--text); }
  .mx tr.g td.n { background:#26334a; }
  .mx td.n .st { color:var(--muted); font-weight:400; }
  .mx td.c { width:30px; text-align:center; height:30px; vertical-align:middle; }
  .mx td.c.we { background:rgba(148,163,184,.05); } .mx td.c.today { background:rgba(56,189,248,.08); }
  .dot { display:inline-block; width:13px; height:13px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); } .dot.run { background:var(--accent); }
  .dot.miss { border-color:var(--bad); background:transparent; } .dot.none { border-color:#475569; background:transparent; } .dot.wait { border-color:#475569; border-style:dashed; background:transparent; }
  .dot.sel { box-shadow:0 0 0 2px #fff; }
  .mx td.sum { text-align:right; padding:0 10px 0 14px; color:var(--muted); font-size:11px; white-space:nowrap; }
  .mx td.sum b { color:var(--text); }
  #detail .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  #detail .row span:last-child { text-align:right; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .dim { color:var(--muted); }
  .empty { color:var(--muted); padding:20px; text-align:center; }
  .tip { position:fixed; pointer-events:none; background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; z-index:5; display:none; white-space:pre-line; box-shadow:0 4px 14px rgba(0,0,0,.4); }
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <button id="prev">◀</button><h1 id="title"></h1><button id="next">▶</button>
    <button id="thisMonth">이번 달</button>
    <span class="legend"><span><i style="background:var(--ok)"></i>정상</span><span><i style="background:var(--warn)"></i>경고</span><span><i style="background:var(--bad)"></i>실패</span><span><i style="border:2px solid var(--bad);background:none"></i>백업 없음</span><span><i style="border:2px dashed #475569;background:none"></i>판단 전</span><span><i style="border:2px solid #475569;background:none"></i>주말·해당 없음</span></span>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="p"><h2>일자별 백업 현황 <small id="sub">점을 클릭하면 아래에 상세가 나옵니다</small></h2><div class="tw" id="mx"></div></div>
  <div class="p" id="dp" hidden><h2 id="dtitle"></h2><div id="detail"></div></div>
</main>
<div class="tip" id="tip"></div>
<script src="common.js"></script>
<script>
MON.renderNav('backup.html'); MON.pollNav(); setInterval(MON.pollNav, 30000);
const $ = (s) => document.querySelector(s), esc = MON.esc, fmtBytes = MON.fmtBytes;
const p2 = (n) => String(n).padStart(2, '0');
let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);   // 보는 달
let data = null, sel = null;
const STAGE = { sql: '1차 백업(SQL)', veeam: '2차 백업(Veeam)', usb: '3차 백업(USB)' };
const fmtT = (t) => { const d = new Date(t); return `${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const isWe = (k) => { const d = new Date(k + 'T00:00:00').getDay(); return d === 0 || d === 6; };
const dur = (s) => s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.round(s % 3600 / 60)}분` : `${Math.round(s / 60)}분`;

async function load() {
  const r = await fetch(`api/backups?month=${cur.getFullYear()}-${p2(cur.getMonth() + 1)}`); data = await r.json();
  $('#title').textContent = `${cur.getFullYear()}년 ${cur.getMonth() + 1}월`;
  render();
}
// 그 날짜의 USB 기록 (이름별; 구버전 기록 e.usb 는 이름 없음으로)
function usbOf(e, name) { if (e.usbs && e.usbs[name || '']) return e.usbs[name || '']; if (!name && e.usb) return e.usb; return null; }
// 셀 상태: ok/warn/bad/run(실행 중)/miss(있어야 하는데 없음)/none(주말·해당 없음)/wait(오늘 아직 판단 전)/future
function cellState(row, k) {
  const e = (data.data[row.host] || {})[k] || {};
  const today = data.today, skipW = data.settings.skip_weekend;
  if (k > today) return { st: 'future' };
  if (row.stage === 'sql') { if (e.sql) return { st: 'ok', e }; }
  else if (row.stage === 'usb') { const u = usbOf(e, row.usb); if (u) return { st: u.ok === false ? 'bad' : 'ok', e }; }
  else if (row.stage === 'veeam') { const v = e.veeam && e.veeam[row.job]; if (v) return { st: v.result === 'Success' ? 'ok' : v.result === 'Warning' ? 'warn' : v.result === 'Running' ? 'run' : 'bad', e }; }
  if (k === today) {
    const ct = data.settings.check_time || ''; const m = /^(\d{1,2}):(\d{2})$/.exec(ct); const now = new Date();
    if (m && now.getHours() * 60 + now.getMinutes() < Number(m[1]) * 60 + Number(m[2])) return { st: 'wait' };
  }
  if (row.stage !== 'veeam' && skipW && isWe(k)) return { st: 'none' };
  return { st: 'miss' };
}
function tipText(row, k, c) {
  const e = c.e || {};
  if (c.st === 'future') return '';
  let t = `${k} · ${row.label}\n`;
  if (row.stage === 'sql' && e.sql) t += `백업 파일 ${fmtT(e.sql.time)}\n${e.sql.file || ''}${e.sql.size ? ' · ' + fmtBytes(e.sql.size) : ''}\n폴더 파일 ${e.sql.count}개` + (e.dbs ? `\nDB 전체 백업 ${Object.keys(e.dbs).length}개` : '');
  else if (row.stage === 'usb' && usbOf(e, row.usb)) { const u = usbOf(e, row.usb); t += `복사 ${fmtT(u.time)}${u.ok === false ? ' · 실패 (코드 ' + u.code + ')' : u.ok === true ? ' · 정상 (코드 ' + u.code + ')' : ''}\n${u.path || u.drive || ''} ${u.count == null ? '' : '파일 ' + u.count + '개'}${u.total ? ' · 남은 ' + fmtBytes(u.free) : ''}`; }
  else if (row.stage === 'veeam' && e.veeam && e.veeam[row.job]) { const v = e.veeam[row.job]; t += `${v.result} · 종료 ${v.end ? fmtT(v.end) : '-'}${v.duration ? ' · ' + dur(v.duration) : ''}${v.size ? ' · ' + fmtBytes(v.size) : ''}`; }
  else t += { miss: '백업 없음', none: '주말 (백업 안 함)', wait: '오늘 판단 시각 전' }[c.st] || '';
  return t;
}
function render() {
  const days = data.days, today = data.today;
  // 행 구성
  const rows = [];
  for (const h of data.hosts) {
    const nm = h.name || h.host;
    if (h.stages.includes('sql')) rows.push({ host: h.host, name: nm, stage: 'sql', label: STAGE.sql });
    if (h.stages.includes('usb')) for (const un of (h.usbs && h.usbs.length ? h.usbs : [''])) rows.push({ host: h.host, name: nm, stage: 'usb', usb: un, label: `${STAGE.usb}${un ? ' · ' + un : ''}` });
    if (h.stages.includes('veeam')) for (const j of h.jobs) rows.push({ host: h.host, name: nm, stage: 'veeam', job: j, label: `${STAGE.veeam} · ${j}` });
  }
  // KPI: 오늘 + 이번 달 성공률 (단계별)
  const kp = {}; for (const st of ['sql', 'veeam', 'usb']) kp[st] = { todayOk: 0, todayN: 0, ok: 0, exp: 0, bad: 0 };
  for (const r of rows) for (const k of days) { const c = cellState(r, k); const g = kp[r.stage];
    if (k === today) { g.todayN++; if (c.st === 'ok' || c.st === 'warn') g.todayOk++; }
    if (c.st === 'ok' || c.st === 'warn' || c.st === 'bad' || c.st === 'miss') { g.exp++; if (c.st === 'ok' || c.st === 'warn') g.ok++; else g.bad++; } }
  $('#kpis').innerHTML = ['sql', 'veeam', 'usb'].map((st) => { const g = kp[st]; if (!rows.some((r) => r.stage === st)) return ''; const rate = g.exp ? Math.round(g.ok / g.exp * 100) : null;
    return `<div class="kpi ${g.todayN && g.todayOk === g.todayN ? 'ok' : g.todayOk ? 'warn' : g.todayN ? 'bad' : ''}"><div class="l">${STAGE[st]} · 오늘</div><div class="v">${g.todayOk}<small>/ ${g.todayN}</small></div><div class="s">이번 달 성공률 ${rate == null ? '-' : rate + '%'} (${g.ok}/${g.exp}${g.bad ? ', 문제 ' + g.bad + '일' : ''})</div></div>`; }).join('')
    + (() => { const all = Object.values(kp).reduce((a, g) => ({ ok: a.ok + g.ok, exp: a.exp + g.exp, bad: a.bad + g.bad }), { ok: 0, exp: 0, bad: 0 }); return `<div class="kpi ${all.bad ? 'warn' : 'ok'}"><div class="l">이번 달 전체</div><div class="v">${all.exp ? Math.round(all.ok / all.exp * 100) : 0}<small>%</small></div><div class="s">정상 ${all.ok} · 문제 ${all.bad} (서버×단계×일)</div></div>`; })();
  if (!rows.length) { $('#mx').innerHTML = '<div class="empty">백업 정보를 보내는 서버가 없습니다. 에이전트 1.5 이상을 설치하면 SQL 백업 폴더·Veeam·USB 상태가 여기에 쌓입니다.</div>'; return; }
  // 매트릭스
  let h = `<table class="mx"><thead><tr><th class="n"></th>${days.map((k) => { const d = new Date(k + 'T00:00:00'); return `<th class="d ${isWe(k) ? 'we' : ''} ${k === today ? 'today' : ''}">${d.getDate()}<span>${'일월화수목금토'[d.getDay()]}</span></th>`; }).join('')}<th>정상 / 문제</th></tr></thead><tbody>`;
  let lastHost = null;
  for (const r of rows) {
    if (r.host !== lastHost) { h += `<tr class="g"><td class="n">${esc(r.name)} <span class="st">${esc(r.host)}</span></td><td colspan="${days.length + 1}"></td></tr>`; lastHost = r.host; }
    let ok = 0, bad = 0;
    const cells = days.map((k) => { const c = cellState(r, k); if (c.st === 'ok' || c.st === 'warn') ok++; if (c.st === 'bad' || c.st === 'miss') bad++;
      const id = `${r.host}|${r.stage}|${r.job || r.usb || ''}|${k}`;
      return `<td class="c ${isWe(k) ? 'we' : ''} ${k === today ? 'today' : ''}">${c.st === 'future' ? '' : `<span class="dot ${c.st} ${sel === id ? 'sel' : ''}" data-id="${esc(id)}"></span>`}</td>`; }).join('');
    h += `<tr><td class="n">&nbsp;&nbsp;${esc(r.label)}</td>${cells}<td class="sum"><b class="ok">${ok}</b> / <b class="${bad ? 'bad' : ''}">${bad}</b></td></tr>`;
  }
  $('#mx').innerHTML = h + '</tbody></table>';
  const tip = $('#tip');
  $('#mx').onmouseover = (e) => { const d = e.target.closest('.dot'); if (!d) { tip.style.display = 'none'; return; } const [host, stage, job, k] = d.dataset.id.split('|'); const r = rows.find((x) => x.host === host && x.stage === stage && (x.job || x.usb || '') === job); const t = tipText(r, k, cellState(r, k)); if (!t) return; tip.textContent = t; tip.style.display = 'block'; tip.style.left = Math.min(window.innerWidth - 260, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
  $('#mx').onmouseleave = () => { tip.style.display = 'none'; };
  $('#mx').onclick = (e) => { const d = e.target.closest('.dot'); if (!d) return; sel = d.dataset.id; render(); showDetail(); };
  if (sel) showDetail();
}
function showDetail() {
  const [host, stage, job, k] = sel.split('|'); const hinfo = data.hosts.find((x) => x.host === host); const e = (data.data[host] || {})[k] || {};
  const nm = hinfo ? (hinfo.name || hinfo.host) : host; const rowsH = [];
  $('#dtitle').innerHTML = `${esc(k)} · ${esc(nm)} · ${STAGE[stage]}${job ? ' · ' + esc(job) : ''}`;
  const row = (a, b) => rowsH.push(`<div class="row"><span>${a}</span><span>${b}</span></div>`);
  if (stage === 'sql') {
    if (e.sql) { row('백업 파일 시각', fmtT(e.sql.time)); row('최신 파일', esc(e.sql.file || '-')); row('파일 크기', e.sql.size ? fmtBytes(e.sql.size) : '-'); row('폴더', `${esc(e.sql.path || '')} · ${e.sql.count}개 · ${fmtBytes(e.sql.total || 0)}`); }
    else row('SQL 백업', '<span class="bad">이 날짜의 백업 파일 없음</span>');
    if (e.dbs) for (const [db, v] of Object.entries(e.dbs)) row(`DB ${esc(db)} 전체 백업`, `${fmtT(v.time)}${v.size ? ' · ' + fmtBytes(v.size) : ''}`);
  } else if (stage === 'usb') {
    const u = usbOf(e, job);
    if (u) { row('복사 시각', fmtT(u.time)); row('결과', u.ok === false ? `<span class="bad">실패 (코드 ${u.code})</span>` : u.ok === true ? `<span class="ok">정상 (코드 ${u.code})</span>` : '<span class="ok">복사됨 (bat 기록 없음)</span>'); row('드라이브 · 폴더', esc(u.path || u.drive || '-')); row('파일', `${u.count == null ? '많음 (세지 않음)' : u.count + '개'}${u.file ? ' · 최신 ' + esc(u.file) : ''}`); row('USB 남은 용량', u.total ? `${fmtBytes(u.free)} / ${fmtBytes(u.total)}` : '-'); }
    else row('USB 백업', '<span class="bad">이 날짜의 USB 복사 기록 없음</span>');
  } else { const v = e.veeam && e.veeam[job];
    if (v) { row('결과', `<span class="${v.result === 'Success' ? 'ok' : v.result === 'Warning' ? 'warn' : 'bad'}">${esc(v.result)}</span>`); row('종료', v.end ? fmtT(v.end) : '-'); row('소요', v.duration ? dur(v.duration) : '-'); row('크기', v.size ? fmtBytes(v.size) : '-'); row('종류', esc(v.type || '')); }
    else row('Veeam 작업', '<span class="bad">이 날짜의 실행 기록 없음</span>'); }
  $('#detail').innerHTML = rowsH.join(''); $('#dp').hidden = false;
}
$('#prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); sel = null; $('#dp').hidden = true; load(); };
$('#next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); sel = null; $('#dp').hidden = true; load(); };
$('#thisMonth').onclick = () => { const n = new Date(); cur = new Date(n.getFullYear(), n.getMonth(), 1); load(); };
fetch('api/health').then((r) => r.json()).then((j) => MON.setVersion(j.version)).catch(() => {});
load().catch((e) => { $('#mx').innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`; });
setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
