<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0b1220; --card:#131c2e; --line:#243044; --text:#e2e8f0; --muted:#8b9bb4; --ok:#22c55e; --warn:#fab219; --bad:#ef4444; --accent:#38bdf8;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  body.alarm { animation: flash 2s infinite; }
  @keyframes flash { 0%,100% { background:var(--bg); } 50% { background:#3b0f16; } }
  .wrap { padding:14px 20px; display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:auto auto minmax(0,1fr) minmax(0,1.1fr); gap:14px; height:calc(100vh - 44px); }
  body.tv .wrap { height:100vh; }
  .head { grid-column:1/-1; display:flex; align-items:center; gap:18px; }
  .head h1 { font-size:26px; margin:0; font-weight:700; }
  .head .chips { display:flex; gap:8px; margin-left:8px; }
  .chip { font-size:14px; padding:4px 12px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .chip b { margin-left:4px; } .chip.ok b { color:var(--ok); } .chip.warn b { color:var(--warn); } .chip.bad b { color:var(--bad); }
  .head .clock { margin-left:auto; font-size:26px; font-variant-numeric:tabular-nums; color:var(--muted); }
  .head .date { font-size:14px; color:var(--muted); }
  .p { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .p h2 { font-size:15px; margin:0 0 8px; color:var(--text); font-weight:700; display:flex; align-items:center; gap:8px; }
  .p h2 small { color:var(--muted); font-weight:400; font-size:12px; }
  .c3 { grid-column:span 3; } .c4 { grid-column:span 4; } .c6 { grid-column:span 6; } .c12 { grid-column:span 12; }
  /* 도넛 */
  .donut { display:flex; align-items:center; gap:14px; flex:1; min-height:170px; }
  .donut svg { width:150px; height:150px; flex:none; }
  .donut .legend { flex:1; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .legend .li { display:flex; align-items:center; gap:8px; }
  .legend .sw { width:12px; height:12px; border-radius:3px; flex:none; }
  .legend .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .legend .ct { font-variant-numeric:tabular-nums; color:var(--muted); }
  .donut .total { position:absolute; text-align:center; }
  .dwrap { position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; }
  .dwrap .tt { position:absolute; text-align:center; } .dwrap .tt b { display:block; font-size:30px; line-height:1; } .dwrap .tt span { font-size:11px; color:var(--muted); }
  /* 가로 막대 순위 */
  .bars { display:flex; flex-direction:column; gap:7px; flex:1; justify-content:center; min-height:170px; }
  .br { display:grid; grid-template-columns:38% 1fr 64px; align-items:center; gap:10px; font-size:13px; }
  .br .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .br .tr { height:10px; background:#0b1220; border-radius:5px; overflow:hidden; }
  .br .tr i { display:block; height:100%; border-radius:0 5px 5px 0; background:var(--s1); }
  .br.w .tr i { background:var(--warn); } .br.b .tr i { background:var(--bad); }
  .br .v { text-align:right; font-variant-numeric:tabular-nums; } .br.b .v { color:var(--bad); font-weight:700; }
  /* 점검 필요 */
  .chk { display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1; }
  .chk .box { background:#0b1220; border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chk .box h3 { margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .chk .kv { display:flex; justify-content:space-between; font-size:13px; align-items:center; gap:6px; }
  .chk .kv > span:first-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chk .kv b { font-size:20px; font-variant-numeric:tabular-nums; }
  .chk .kv.ok b { color:var(--ok); } .chk .kv.warn b { color:var(--warn); } .chk .kv.bad b { color:var(--bad); }
  .chk .kv .d { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .chk .kv.ok .d { background:var(--ok); } .chk .kv.warn .d { background:var(--warn); } .chk .kv.bad .d { background:var(--bad); } .chk .kv.mute .d { background:#64748b; }
  .need { margin-top:auto; text-align:center; font-size:17px; font-weight:700; padding:8px; border-radius:8px; }
  .need.ok { color:var(--ok); background:rgba(34,197,94,.1); } .need.bad { color:#fff; background:var(--bad); }
  /* 저장장치 게이지 */
  .gauges { display:flex; gap:12px; flex:1; min-height:0; }
  .gg { flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; }
  .gg .nm { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .gg .sub { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .gg .cyl { position:relative; width:64px; flex:1; min-height:60px; margin:6px 0; border-radius:10px; background:#0b1220; border:1px solid var(--line); overflow:hidden; }
  .gg .cyl i { position:absolute; left:0; right:0; bottom:0; background:var(--s3); border-radius:0 0 9px 9px; }
  .gg.w .cyl i { background:var(--warn); } .gg.b .cyl i { background:var(--bad); }
  .gg .cyl span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  .gg .ft { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  /* 표 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 8px; border-bottom:1px solid var(--line); }
  td { padding:5px 8px; border-bottom:1px solid rgba(36,48,68,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:0; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .lv { display:inline-flex; align-items:center; gap:6px; } .lv .d { width:9px; height:9px; border-radius:50%; }
  .lv.alert .d { background:var(--bad); } .lv.remind .d { background:var(--warn); } .lv.recovery .d { background:var(--ok); }
  .tbl { flex:1; min-height:0; overflow:hidden; }
  .empty { color:var(--muted); font-size:13px; padding:10px 0; }
  .foot { grid-column:1/-1; font-size:12px; color:var(--muted); text-align:right; margin-top:-8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>서버 상태 현황</h1><span class="date" id="date"></span><div class="chips" id="chips"></div><span class="clock" id="clock"></span></div>

  <div class="p c3"><h2>OS별 서버 현황</h2><div class="donut"><div class="dwrap"><svg id="donut" viewBox="0 0 120 120"></svg><div class="tt"><b id="dTotal">0</b><span>전체 서버</span></div></div><div class="legend" id="dLegend"></div></div></div>
  <div class="p c3"><h2>CPU 사용률 <small>Top 5</small></h2><div class="bars" id="bCpu"></div></div>
  <div class="p c3"><h2>메모리 사용률 <small>Top 5</small></h2><div class="bars" id="bMem"></div></div>
  <div class="p c3"><h2>점검 필요</h2><div class="chk" id="chk"></div><div class="need" id="need"></div></div>

  <div class="p c6"><h2>저장장치 사용률 <small>Top 5</small></h2><div class="gauges" id="gauges"></div></div>
  <div class="p c6"><h2>디스크 소진 임박 <small>예상 소진일 순</small></h2><div class="tbl" id="full"></div></div>

  <div class="p c12"><h2>이벤트 현황 <small id="evsub"></small></h2><div class="tbl" id="events"></div></div>
</div>
<script src="common.js"></script>
<script>
const { esc, fmtBytes, label, grade, fmtTime } = MON;
if (MON.params.get('tv') === '1') document.body.classList.add('tv');
MON.renderNav('dashboard.html');
function clock() { const d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString('ko-KR', { hour12: false }); document.getElementById('date').textContent = d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }); }
setInterval(clock, 1000); clock();

const SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
function osType(s) {
  const o = String(s.os || '');
  if (/ESXi/i.test(o)) return 'VMware ESXi';
  if ((s.disks || []).some(d => /^\/volume\d/.test(d.mount)) || /Synology|DSM/i.test(o)) return 'NAS';
  if (/Windows Server/i.test(o)) return 'Windows Server';
  if (/Windows/i.test(o)) return 'Windows PC';
  if (/CentOS|Rocky|Ubuntu|Debian|Red Hat|RHEL|SUSE|Alma|Linux/i.test(o)) return 'Linux';
  return '기타';
}
function lvl(p) { return p >= 90 ? 'b' : p >= 75 ? 'w' : ''; }
function barRow(name, pct, text) { return `<div class="br ${lvl(pct)}"><span class="nm" title="${esc(name)}">${esc(name)}</span><div class="tr"><i style="width:${Math.min(100, pct)}%"></i></div><span class="v">${text}</span></div>`; }

function donut(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const svg = document.getElementById('donut'); const r = 46, C = 2 * Math.PI * r; let off = 0, i = 0, html = '';
  for (const [k, v] of Object.entries(counts)) {
    const len = total ? v / total * C : 0;
    html += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(${SERIES[i % 6]})" stroke-width="14" stroke-dasharray="${Math.max(0, len - 2)} ${C - Math.max(0, len - 2)}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(k)} ${v}대</title></circle>`;
    off += len; i++;
  }
  svg.innerHTML = html || `<circle cx="60" cy="60" r="${r}" fill="none" stroke="#243044" stroke-width="14"/>`;
  document.getElementById('dTotal').textContent = total;
  document.getElementById('dLegend').innerHTML = Object.entries(counts).map(([k, v], i) => `<div class="li"><span class="sw" style="background:var(${SERIES[i % 6]})"></span><span class="nm">${esc(k)}</span><span class="ct">${v}대</span></div>`).join('');
}

async function refresh() {
  try {
    const [sr, ar] = await Promise.all([fetch('api/servers'), fetch('api/alerts?n=12')]);
    const sj = await sr.json(), aj = await ar.json();
    const servers = sj.servers, active = aj.active || [], recent = aj.recent || [];
    MON.setVersion(sj.version);
    const byHost = {}; for (const s of servers) byHost[s.host] = s;
    const g = {}; for (const s of servers) g[s.host] = grade(s, active);
    const cnt = { ok: 0, warn: 0, bad: 0, off: 0 }; for (const s of servers) cnt[g[s.host]]++;
    document.body.classList.toggle('alarm', cnt.off > 0 || cnt.bad > 0);
    document.getElementById('chips').innerHTML = `<span class="chip">전체<b>${servers.length}</b></span><span class="chip ok">정상<b>${cnt.ok}</b></span><span class="chip warn">주의<b>${cnt.warn}</b></span><span class="chip bad">위험<b>${cnt.bad}</b></span><span class="chip bad">오프라인<b>${cnt.off}</b></span>`;

    // OS 도넛
    const oc = {}; for (const s of servers) { const t = osType(s); oc[t] = (oc[t] || 0) + 1; }
    donut(Object.fromEntries(Object.entries(oc).sort((a, b) => b[1] - a[1])));

    // CPU / 메모리 Top5
    const on = servers.filter(s => s.online);
    document.getElementById('bCpu').innerHTML = on.slice().sort((a, b) => b.cpu - a.cpu).slice(0, 5).map(s => barRow(label(s), s.cpu, s.cpu + '%')).join('') || '<div class="empty">데이터 없음</div>';
    document.getElementById('bMem').innerHTML = on.slice().sort((a, b) => b.mem_pct - a.mem_pct).slice(0, 5).map(s => barRow(label(s), s.mem_pct, s.mem_pct + '%')).join('') || '<div class="empty">데이터 없음</div>';

    // 점검 필요
    const nAlert = active.filter(a => a.rule !== 'offline').length, nFull = servers.flatMap(s => (s.growth || [])).filter(x => x.days_left != null && x.days_left <= 30).length;
    const stale = servers.filter(s => s.online && s.age > 20).length;
    document.getElementById('chk').innerHTML =
      `<div class="box"><h3>장애 현황</h3>
        <div class="kv bad"><span><span class="d"></span>오프라인</span><b>${cnt.off}</b></div>
        <div class="kv bad"><span><span class="d"></span>위험 90%↑</span><b>${cnt.bad}</b></div>
        <div class="kv warn"><span><span class="d"></span>주의 75%↑</span><b>${cnt.warn}</b></div>
        <div class="kv ok"><span><span class="d"></span>정상</span><b>${cnt.ok}</b></div></div>
       <div class="box"><h3>운영 상태</h3>
        <div class="kv bad"><span><span class="d"></span>알림 발생</span><b>${nAlert}</b></div>
        <div class="kv warn"><span><span class="d"></span>디스크 소진 임박</span><b>${nFull}</b></div>
        <div class="kv warn"><span><span class="d"></span>수신 지연</span><b>${stale}</b></div>
        <div class="kv mute"><span><span class="d"></span>알림 꺼짐</span><b>${servers.filter(s => s.muted).length}</b></div></div>`;
    const needN = cnt.off + cnt.bad;
    const need = document.getElementById('need'); need.className = 'need ' + (needN ? 'bad' : 'ok'); need.textContent = needN ? `⚠ 점검 필요 ${needN}대` : '✓ 점검 필요 없음';

    // 저장장치 게이지 Top5
    const disks = []; for (const s of on) for (const d of (s.disks || [])) disks.push({ s, d });
    disks.sort((a, b) => b.d.pct - a.d.pct);
    document.getElementById('gauges').innerHTML = disks.slice(0, 5).map(({ s, d }) => `<div class="gg ${lvl(d.pct)}"><span class="nm" title="${esc(label(s))}">${esc(label(s))}</span><span class="sub">${esc(d.mount)} · 전체 ${fmtBytes(d.total)}</span><div class="cyl"><i style="height:${Math.min(100, d.pct)}%"></i><span>${d.pct}%</span></div><span class="ft">사용 ${fmtBytes(d.used)} · 여유 ${fmtBytes(d.total - d.used)}</span></div>`).join('') || '<div class="empty">데이터 없음</div>';

    // 디스크 소진 임박
    const full = []; for (const s of servers) for (const x of (s.growth || [])) if (x.days_left != null) full.push({ s, x });
    full.sort((a, b) => a.x.days_left - b.x.days_left);
    document.getElementById('full').innerHTML = full.length
      ? `<table><thead><tr><th>서버</th><th>드라이브</th><th class="n">사용률</th><th class="n">하루 증가</th><th class="n">예상 소진</th></tr></thead><tbody>${full.slice(0, 6).map(({ s, x }) => `<tr><td>${esc(label(s))}</td><td>${esc(x.mount)}</td><td class="n">${Math.round(x.used / x.total * 100)}%</td><td class="n">+${fmtBytes(x.rate_day)}</td><td class="n" style="${x.days_left < 30 ? 'color:var(--bad);font-weight:700' : ''}">${x.days_left > 3650 ? '10년 이상' : '약 ' + x.days_left + '일'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">아직 증가량 데이터가 없습니다 (매일 11:30 이후 하루 1개씩 쌓입니다)</div>';

    // 이벤트 현황
    const day = Date.now() - 86400000;
    document.getElementById('evsub').textContent = `최근 24시간 ${recent.filter(e => e.time >= day && e.kind !== 'recovery').length}건`;
    const KIND = { alert: '경고', remind: '계속', recovery: '복귀' }, DL = { telegram: '텔레그램', quiet: '조용 시간', error: '전송 실패', off: '미전송', skipped: '기록만' };
    document.getElementById('events').innerHTML = recent.length
      ? `<table><thead><tr><th style="width:110px">시각</th><th style="width:80px">구분</th><th style="width:22%">서버</th><th>내용</th><th style="width:90px">전송</th></tr></thead><tbody>${recent.slice(0, 8).map(e => `<tr><td>${fmtTime(e.time)}</td><td><span class="lv ${e.kind}"><span class="d"></span>${KIND[e.kind] || e.kind}</span></td><td>${esc(label(byHost[e.host] || { host: e.host }))}</td><td title="${esc(e.msg)}">${esc(e.msg)}</td><td>${DL[e.delivery] || ''}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">최근 알림 없음</div>';
  } catch (e) { document.getElementById('evsub').textContent = '수집 서버 연결 실패: ' + e.message; }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
