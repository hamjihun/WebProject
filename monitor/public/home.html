<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILSAN 사내 시스템</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; }
  .top { display:flex; align-items:center; gap:10px; padding:0 20px; height:48px; border-bottom:1px solid var(--line); background:var(--card); }
  .top .brand { font-weight:700; font-size:15px; } .top .spacer { flex:1; }
  .top .who { color:var(--muted); font-size:12px; }
  .top button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .top button:hover { color:var(--text); }
  .wrap { max-width:900px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:22px; margin:0 0 6px; } .lead { color:var(--muted); font-size:13px; margin-bottom:28px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  a.tile { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px; text-decoration:none; color:inherit; transition:border-color .12s, transform .12s; }
  a.tile:hover { border-color:var(--accent); transform:translateY(-2px); }
  a.tile.off { opacity:.55; pointer-events:none; }
  .tile .ico { font-size:30px; } .tile .nm { font-size:17px; font-weight:700; margin:10px 0 4px; }
  .tile .ds { color:var(--muted); font-size:12px; }
  .tile .sub { margin-top:12px; color:var(--muted); font-size:11px; border-top:1px solid var(--line); padding-top:10px; }
  .msg { background:rgba(239,68,68,.12); border:1px solid var(--bad); color:#fecaca; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:20px; }
  .empty { color:var(--muted); }
  h3.sec { font-size:13px; color:var(--muted); font-weight:400; margin:30px 0 12px; border-top:1px solid var(--line); padding-top:18px; }
  /* 오늘 · 이번 주 할 일 */
  .todo { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; margin-bottom:6px; }
  @media (max-width:820px) { .todo { grid-template-columns:1fr; } }
  .tp { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .tp.late { border-color:var(--bad); background:rgba(239,68,68,.08); grid-column:1/-1; }
  .tp h2 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .tp h2 small { color:var(--muted); font-weight:400; font-size:12px; }
  .tp h2 a { margin-left:auto; color:var(--accent); font-size:12px; text-decoration:none; }
  .it { border-left:3px solid var(--c,#38bdf8); background:var(--bg); border-radius:8px; padding:8px 11px; margin-bottom:7px; display:block; color:inherit; text-decoration:none; }
  .it:hover { outline:1px solid var(--accent); }
  .it.done { opacity:.5; } .it.done .ttl { text-decoration:line-through; }
  .it .r1 { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .it .tm { color:var(--accent); font-weight:700; font-size:12px; } .it .ttl { font-weight:600; font-size:13px; }
  .it .r2 { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .it .nt { background:var(--card); border-radius:6px; padding:5px 8px; margin-top:5px; font-size:12px; line-height:1.5; }
  .it .nt i { color:var(--muted); font-style:normal; font-size:11px; display:block; }
  .dh { font-size:12px; color:var(--muted); margin:10px 0 6px; } .dh b { color:var(--text); }
  .tg { font-size:10px; border-radius:4px; padding:0 4px; font-weight:700; }
  .tg.hi { background:#f59e0b; color:#0f172a; } .tg.ur { background:#ef4444; color:#fff; } .tg.team { background:#64748b; color:#fff; }
  .tnone { color:var(--muted); font-size:12px; padding:8px 0; }
</style>
</head>
<body>
<div class="top"><span class="brand">ILSAN 사내 시스템</span><span class="spacer"></span><span class="who" id="who"></span><button id="out">로그아웃</button></div>
<div class="wrap">
  <div id="msg"></div>
  <h1 id="hi">어느 화면으로 가시겠습니까?</h1>
  <div class="lead" id="lead"></div>
  <div id="todo"></div>
  <h3 class="sec" id="tilesec" hidden>바로 가기</h3>
  <div class="tiles" id="tiles"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const denied = new URLSearchParams(location.search).get('denied');
if (denied) $('#msg').innerHTML = `<div class="msg">"${esc(denied)}" 화면을 볼 권한이 없습니다. 관리자에게 요청하세요.</div>`;
(async () => {
  const r = await fetch('api/me');
  if (r.status === 401) { location.href = 'login.html'; return; }
  const j = await r.json();
  $('#who').textContent = `${j.user.name} (${j.user.id})` + (j.user.admin ? ' · 관리자' : '');
  $('#hi').textContent = `${j.user.name}님, 어느 화면으로 가시겠습니까?`;
  $('#lead').textContent = '수집기 v' + j.version;
  if (j.apps.some((a) => a.key === 'schedule')) loadTodo();
  $('#tiles').innerHTML = j.apps.length ? j.apps.map(a => `
    <a class="tile ${a.ready ? '' : 'off'}" href="${esc(a.home)}">
      <div class="ico">${a.icon}</div>
      <div class="nm">${esc(a.name)}${a.ready ? '' : ' <span style="font-size:12px;font-weight:400">(준비 중)</span>'}</div>
      <div class="ds">${esc(a.desc)}</div>
      ${a.pages.length > 1 ? `<div class="sub">${a.pages.map(p => esc(p[1])).join(' · ')}</div>` : ''}
    </a>`).join('') : '<div class="empty">볼 수 있는 화면이 없습니다. 관리자에게 권한을 요청하세요.</div>';
})();
// ---- 오늘 · 이번 주 할 일 ----
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const ST_COLOR = { '예정': '#60a5fa', '진행': '#fbbf24', '완료': '#22c55e', '보류': '#94a3b8' };
const COLORS = ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#fb923c', '#60a5fa', '#4ade80'];
let deptList = [];
const dcolor = (d) => COLORS[Math.max(0, deptList.indexOf(d)) % COLORS.length];
const fmtAt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function item(it, showDate) {
  const tag = it.prio === '긴급' ? '<span class="tg ur">긴급</span>' : it.prio === '중요' ? '<span class="tg hi">중요</span>' : '';
  const sh = it.share === 'team' ? '<span class="tg team">팀</span>' : '';
  const dt = showDate ? ` · ${it.date.slice(5).replace('-', '/')}` : '';
  return `<a class="it ${it.status === '완료' ? 'done' : ''}" style="--c:${dcolor(it.dept)}" href="schedule.html?id=${encodeURIComponent(it.id)}&date=${it.date}">
    <div class="r1">${it.time ? `<span class="tm">${it.time}</span>` : ''}${tag}${sh}<span class="ttl">${esc(it.title)}</span></div>
    <div class="r2"><span style="color:${ST_COLOR[it.status]}">●</span> ${it.status}${dt} · ${esc(it.owner || '담당자 없음')}${it.dept ? ' · ' + esc(it.dept) : ''}</div>
    ${(it.notes || []).slice(0, 2).map((n) => `<div class="nt"><i>${esc(n.by)} · ${fmtAt(n.at)}</i>${esc(n.text)}</div>`).join('')}
  </a>`;
}
async function loadTodo() {
  try {
    const r = await fetch('api/schedule/todo');
    if (!r.ok) return;
    const j = await r.json();
    if (!j.ok) return;
    const today = j.days[0] || { items: [] };
    const rest = j.days.slice(1).filter((d) => d.items.length);
    let h = '';
    if (j.late.length) h += `<div class="todo"><div class="tp late"><h2>밀린 일 <small>기한이 지났는데 아직 안 끝난 일 ${j.late.length}건</small><a href="schedule.html">일정 화면 →</a></h2>
      ${j.late.slice(0, 5).map((it) => item(it, true)).join('')}</div></div>`;
    const td = new Date(j.today + 'T00:00:00');
    h += `<div class="todo">
      <div class="tp"><h2>오늘 할 일 <small>${td.getMonth() + 1}월 ${td.getDate()}일 (${WD[td.getDay()]})${today.holiday ? ' · ' + esc(today.holiday) : ''}</small><a href="schedule.html">전체 보기 →</a></h2>
        ${today.items.map((it) => item(it, false)).join('') || '<div class="tnone">오늘 등록된 일정이 없습니다.</div>'}</div>
      <div class="tp"><h2>이번 주 <small>내일부터 6일</small></h2>
        ${rest.map((d) => { const dd = new Date(d.date + 'T00:00:00');
          return `<div class="dh"><b>${dd.getMonth() + 1}/${dd.getDate()} (${WD[dd.getDay()]})</b>${d.holiday ? ` <span style="color:#f87171">${esc(d.holiday)}</span>` : ''} · ${d.items.length}건</div>` + d.items.map((it) => item(it, false)).join('');
        }).join('') || '<div class="tnone">앞으로 일주일 동안 등록된 일정이 없습니다.</div>'}</div>
    </div>`;
    $('#todo').innerHTML = h;
    $('#tilesec').hidden = false;
  } catch (e) {}
}
$('#out').onclick = async () => { await fetch('api/logout', { method: 'POST' }); location.href = 'login.html'; };
</script>
</body>
</html>
