<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버 모니터</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --accent:#38bdf8; --barbg:#0b1220; }
  :root[data-theme="light"] { --bg:#f1f5f9; --card:#ffffff; --line:#cbd5e1; --text:#0f172a; --muted:#64748b; --barbg:#e2e8f0; }
  :root[data-theme="light"] .card { box-shadow:0 1px 2px rgba(0,0,0,.06); }
  :root[data-theme="light"] .card.off { background:#fee2e2; }
  :root[data-theme="light"] .up { color:#dc2626; } :root[data-theme="light"] .down { color:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  body.embed header { display:none; }
  body.embed main { padding:10px; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  header .sum { color:var(--muted); font-size:13px; }
  header .sum b { color:var(--text); }
  header .ver { margin-left:auto; color:var(--muted); font-size:11px; }
  main { padding:16px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; align-content:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; transition:border-color .15s; }
  .card:hover, .card.sel { border-color:var(--accent); }
  .card.dragging { opacity:.4; }
  .card.dropTarget { outline:2px dashed var(--accent); outline-offset:2px; }
  .grip { color:var(--muted); font-size:14px; cursor:grab; flex:none; margin-right:-2px; user-select:none; }
  .grip:hover { color:var(--text); }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .actions button { background:none; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  .actions button:hover { border-color:var(--accent); }
  .actions button.danger { color:var(--bad); border-color:var(--bad); margin-left:auto; }
  .actions button:disabled { opacity:.4; cursor:default; }
  .card.off { border-color:var(--bad); background:rgba(239,68,68,.12); }
  .card.off .bar > i { background:#7f1d1d; }
  .top { display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.off { background:var(--bad); }
  .title { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ip { color:var(--muted); font-size:12px; margin-left:auto; flex:none; }
  .hostline { color:var(--muted); font-size:12px; margin:2px 0 8px 18px; }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; background:var(--bad); color:#fff; flex:none; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .row .lbl { width:52px; color:var(--muted); flex:none; }
  .bar { flex:1; height:10px; background:var(--barbg); border-radius:5px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); border-radius:5px; transition:width .4s; }
  .bar > i.w { background:var(--warn); } .bar > i.b { background:var(--bad); }
  .val { width:132px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
  .growth { font-size:11px; margin:-2px 0 6px 60px; }
  .growth .bad { color:var(--bad); font-weight:700; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; display:flex; justify-content:space-between; gap:8px; }
  .empty { grid-column:1/-1; color:var(--muted); text-align:center; padding:60px 0; line-height:1.8; }
  .empty code { color:var(--accent); }
  /* 상세 팝업 */
  #overlay[hidden] { display:none; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10; }
  #detail { background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:18px; width:min(1100px,100%); max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #detail .dtop { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  #detail h2 { margin:0; font-size:18px; }
  #detail .sub { color:var(--muted); font-size:13px; }
  #detail .close { margin-left:auto; background:none; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; }
  #detail .close:hover { border-color:var(--accent); }
  #detail h3 { margin:16px 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  #detail canvas { width:100%; height:220px; display:block; }
  .legend { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 12px; vertical-align:middle; }
  table.g { width:100%; border-collapse:collapse; font-size:13px; }
  table.g th, table.g td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  table.g th:first-child, table.g td:first-child { text-align:left; }
  table.g th { color:var(--muted); font-weight:600; }
  .up { color:#f87171; } .down { color:#4ade80; } .dim { color:var(--muted); }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>서버 모니터</h1>
  <div class="sum" id="sum">연결 중…</div>
  <div class="ver" id="ver"></div>
</header>
<main id="main"></main>
<div id="overlay" hidden>
  <div id="detail">
    <div class="dtop"><h2 id="dtitle"></h2><span class="sub" id="dsub"></span><button class="close" id="dclose">닫기 ✕</button></div>
    <div id="gtable"></div>
    <h3>CPU / 메모리 추이</h3>
    <div class="legend"><span style="background:#38bdf8"></span>CPU %<span style="background:#a78bfa"></span>메모리 %</div>
    <canvas id="chart"></canvas>
    <div class="actions">
      <button id="bPrev">◀ 앞으로</button><button id="bNext">뒤로 ▶</button>
      <span class="dim" style="font-size:12px;align-self:center">카드를 드래그해서 순서를 바꿀 수도 있습니다</span>
      <button id="bRemove" class="danger">목록에서 삭제</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('embed') === '1') document.body.classList.add('embed');
if (params.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
const REFRESH = Math.max(2, Number(params.get('refresh') || 5)) * 1000;

const $main = document.getElementById('main');
const $sum = document.getElementById('sum');
const $overlay = document.getElementById('overlay');
let selected = null;
let servers = [];

// ---------- 포맷 ----------
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i >= 3 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
}
function fmtUptime(s) {
  s = Math.floor(s || 0);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`;
}
function fmtDelta(b) {
  if (b == null) return '<span class="dim">-</span>';
  const sign = b > 0 ? '+' : b < 0 ? '-' : '';
  const c = b > 0 ? 'up' : b < 0 ? 'down' : '';
  return `<span class="${c}">${sign}${fmtBytes(Math.abs(b))}</span>`;
}
function fmtLeft(g) {
  if (g.days_left == null) return g.rate_day != null && g.rate_day <= 0 ? '증가 없음' : '-';
  if (g.days_left > 3650) return '10년 이상';
  return g.days_left < 30 ? `<span class="bad">약 ${g.days_left}일 후 가득</span>` : `약 ${g.days_left}일 후 가득`;
}
function level(p) { return p >= 90 ? 'b' : p >= 75 ? 'w' : ''; }
function bar(label, pct, text) {
  pct = Math.max(0, Math.min(100, pct || 0));
  return `<div class="row"><span class="lbl">${label}</span><div class="bar"><i class="${level(pct)}" style="width:${pct}%"></i></div><span class="val">${text}</span></div>`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- 카드 ----------
function cardHtml(s) {
  const gmap = {}; for (const g of (s.growth || [])) gmap[g.mount] = g;
  const disks = (s.disks || []).map(d => {
    const g = gmap[d.mount];
    const warn = g && g.days_left != null && g.days_left < 90 ? `<div class="growth">${fmtLeft(g)}</div>` : '';
    return bar(esc(d.mount), d.pct, `${fmtBytes(d.used)} / ${fmtBytes(d.total)}`) + warn;
  }).join('');
  const title = s.name || s.host;      // 에이전트에서 설정한 표시 이름, 없으면 호스트명
  return `<div class="card ${s.online ? '' : 'off'} ${selected === s.host ? 'sel' : ''}" data-host="${esc(s.host)}" draggable="true">
    <div class="top"><span class="grip" title="드래그해서 순서 변경">⠿</span><span class="dot ${s.online ? '' : 'off'}"></span><span class="title" title="${esc(title)}">${esc(title)}</span>${s.online ? '' : '<span class="badge">오프라인</span>'}<span class="ip">${esc(s.ip || '')}</span></div>
    <div class="hostline">${s.name ? esc(s.host) : '&nbsp;'}</div>
    ${bar('CPU', s.cpu, `${s.cpu}%`)}
    ${bar('메모리', s.mem_pct, `${fmtBytes(s.mem_used)} / ${fmtBytes(s.mem_total)}`)}
    ${disks}
    <div class="meta"><span>${esc(s.os || '')}</span><span>가동 ${fmtUptime(s.uptime)}</span><span>${s.online ? `${s.age}초 전` : `오프라인 (${fmtUptime(s.age)} 전)`}</span></div>
  </div>`;
}

function render() {
  const online = servers.filter(s => s.online).length;
  $sum.innerHTML = `총 <b>${servers.length}</b>대 · 온라인 <b>${online}</b> · 오프라인 <b>${servers.length - online}</b> · ${new Date().toLocaleTimeString('ko-KR')}`;
  if (!servers.length) {
    $main.innerHTML = `<div class="empty">아직 수신된 데이터가 없습니다.<br>서버에서 에이전트를 실행하면 여기에 카드가 나타납니다.<br>테스트: <code>node agent/simulate.js</code></div>`;
    return;
  }
  $main.innerHTML = servers.map(cardHtml).join('');
  for (const c of $main.querySelectorAll('.card')) {
    c.onclick = () => openDetail(c.dataset.host);
    c.addEventListener('dragstart', (e) => { dragging = c.dataset.host; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    c.addEventListener('dragend', () => { dragging = null; c.classList.remove('dragging'); $main.querySelectorAll('.dropTarget').forEach(x => x.classList.remove('dropTarget')); });
    c.addEventListener('dragover', (e) => { if (dragging && dragging !== c.dataset.host) { e.preventDefault(); c.classList.add('dropTarget'); } });
    c.addEventListener('dragleave', () => c.classList.remove('dropTarget'));
    c.addEventListener('drop', (e) => { e.preventDefault(); if (dragging && dragging !== c.dataset.host) moveHost(dragging, c.dataset.host); });
  }
}

// ---------- 순서 변경 / 삭제 ----------
let dragging = null;
async function saveOrder() {
  try { await fetch('api/order', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order: servers.map(s => s.host) }) }); } catch (e) {}
}
function moveHost(host, beforeHost) {      // host 를 beforeHost 위치로 이동
  const from = servers.findIndex(s => s.host === host), to = servers.findIndex(s => s.host === beforeHost);
  if (from < 0 || to < 0) return;
  const [item] = servers.splice(from, 1);
  servers.splice(to, 0, item);
  render(); saveOrder();
}
function shiftHost(host, delta) {
  const i = servers.findIndex(s => s.host === host), j = i + delta;
  if (i < 0 || j < 0 || j >= servers.length) return;
  [servers[i], servers[j]] = [servers[j], servers[i]];
  render(); saveOrder(); updateActionButtons();
}
function updateActionButtons() {
  const i = servers.findIndex(s => s.host === selected);
  document.getElementById('bPrev').disabled = i <= 0;
  document.getElementById('bNext').disabled = i < 0 || i >= servers.length - 1;
}
document.getElementById('bPrev').onclick = () => shiftHost(selected, -1);
document.getElementById('bNext').onclick = () => shiftHost(selected, 1);
document.getElementById('bRemove').onclick = async () => {
  const s = servers.find(x => x.host === selected) || {};
  const label = s.name ? `${s.name} (${s.host})` : s.host;
  if (!confirm(`${label} 을(를) 목록에서 삭제할까요?\n\n에이전트가 아직 실행 중이면 다음 전송 때 다시 나타납니다. 완전히 빼려면 그 서버에서 에이전트를 제거하세요.`)) return;
  try { await fetch('api/unregister', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ host: selected }) }); } catch (e) {}
  closeDetail(); refresh();
};

// ---------- 상세 팝업 ----------
function growthTable(j) {
  const rows = (j.growth || []).map(g => `<tr><td>${esc(g.mount)}</td><td>${fmtBytes(g.used)} / ${fmtBytes(g.total)}</td>
    <td>${fmtDelta(g.day)}${g.day_days > 1 ? ` <span class="dim">(${g.day_days}일)</span>` : ''}</td>
    <td>${fmtDelta(g.week)}${g.week_days && g.week_days !== 7 ? ` <span class="dim">(${g.week_days}일)</span>` : ''}</td>
    <td>${fmtDelta(g.month)}${g.month_days && g.month_days !== 30 ? ` <span class="dim">(${g.month_days}일)</span>` : ''}</td>
    <td>${g.rate_day != null ? fmtDelta(Math.round(g.rate_day)) + '/일' : '-'}</td><td>${fmtLeft(g)}</td></tr>`).join('');
  const days = (j.daily || []).length;
  if (!rows) return `<h3>드라이브 증가량</h3><div class="note">디스크 정보가 아직 없습니다. (수집기가 이전 버전이면 수집기를 새 버전으로 재설치하세요)</div>`;
  return `<h3>드라이브 증가량</h3>
    <table class="g"><thead><tr><th>드라이브</th><th>사용 / 전체</th><th>전일 대비</th><th>7일 대비</th><th>30일 대비</th><th>하루 평균</th><th>예상</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">${days <= 1 ? '수집 1일차입니다. 전일 대비는 내일부터, 7일·30일 대비는 데이터가 쌓이면 자동으로 채워집니다.' : `현재 ${days}일치 수집. 7일·30일 값이 부족하면 가능한 가장 오래된 날짜 기준으로 (n일) 표시합니다.`}</div>`;
}

function drawChart(canvas, hist) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const padL = 36, padR = 10, padT = 10, padB = 22;
  const w = W - padL - padR, h = H - padT - padB;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#334155'; ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
  for (const p of [0, 25, 50, 75, 100]) {
    const y = padT + h - h * p / 100;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(p + '%', padL - 6, y + 4);
  }
  if (hist.length < 2) return;
  const t0 = hist[0].ts, t1 = hist[hist.length - 1].ts, span = Math.max(1, t1 - t0);
  const x = t => padL + w * (t - t0) / span;
  const y = v => padT + h - h * Math.max(0, Math.min(100, v || 0)) / 100;
  const line = (key, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.beginPath();
    hist.forEach((p, i) => i ? ctx.lineTo(x(p.ts), y(p[key])) : ctx.moveTo(x(p.ts), y(p[key])));
    ctx.stroke();
  };
  line('cpu', '#38bdf8'); line('mem_pct', '#a78bfa');
  ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'left';
  ctx.fillText(new Date(t0).toLocaleTimeString('ko-KR'), padL, H - 6);
  ctx.textAlign = 'right';
  ctx.fillText(new Date(t1).toLocaleTimeString('ko-KR'), W - padR, H - 6);
}

async function loadDetail() {
  if (!selected) return;
  const s = servers.find(x => x.host === selected) || {};
  document.getElementById('dtitle').textContent = s.name || s.host || selected;
  document.getElementById('dsub').textContent = [s.name ? s.host : '', s.ip || ''].filter(Boolean).join(' · ');
  try {
    const r = await fetch('api/history?host=' + encodeURIComponent(selected));
    if (!r.ok) return;
    const j = await r.json();
    document.getElementById('gtable').innerHTML = growthTable(j);
    drawChart(document.getElementById('chart'), j.history);
  } catch (e) {}
}
function openDetail(host) {
  selected = host;
  $overlay.hidden = false;
  render();
  loadDetail();
  updateActionButtons();
}
function closeDetail() {
  selected = null;
  $overlay.hidden = true;
  render();
}
document.getElementById('dclose').onclick = closeDetail;
$overlay.addEventListener('click', (e) => { if (e.target === $overlay) closeDetail(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) closeDetail(); });
window.addEventListener('resize', () => { if (selected) loadDetail(); });

// ---------- 갱신 ----------
async function refresh() {
  try {
    const r = await fetch('api/servers');
    const j = await r.json();
    if (dragging) return;              // 드래그 중에는 갱신 보류
    servers = j.servers;
    if (j.version) document.getElementById('ver').textContent = '수집기 v' + j.version;
    render();
    if (selected) loadDetail();
  } catch (e) {
    $sum.textContent = '수집 서버에 연결할 수 없습니다: ' + e.message;
  }
}
refresh();
setInterval(refresh, REFRESH);
</script>
</body>
</html>
