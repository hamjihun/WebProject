<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 4h22v16l-7 8H5z' fill='%23fbbf24'/%3E%3Cpath d='M27 20l-7 8v-8z' fill='%23d97706'/%3E%3Cg fill='%23854d0e'%3E%3Crect x='9' y='9' width='14' height='2.4' rx='1.2'/%3E%3Crect x='9' y='14' width='14' height='2.4' rx='1.2'/%3E%3Crect x='9' y='19' width='8' height='2.4' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:13px; overflow:hidden; display:flex; flex-direction:column; }
  #topnav { flex:none; }
  #board { position:relative; flex:1; min-height:0; overflow:auto; background:
      radial-gradient(circle at 1px 1px, rgba(148,163,184,.16) 1px, transparent 0) 0 0/28px 28px, var(--bg); }
  #canvas { position:relative; }

  /* 메모판 탭 + 도구 (맨 위 탭줄 안으로 들어간다) */
  #bar { flex:none; display:flex; align-items:center; gap:6px; padding:6px 12px; background:rgba(30,41,59,.6); border-bottom:1px solid var(--line); }
  #bds { display:flex; align-items:center; gap:4px; overflow-x:auto; }
  #bds .bd { display:flex; align-items:center; gap:6px; white-space:nowrap; background:var(--bg); color:var(--muted);
    border:1px solid var(--line); border-radius:7px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
  #bds .bd:hover { color:var(--text); }
  #bds .bd i { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  #bds .bd.on { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700; }
  #bds .bd .mn { opacity:.7; margin-left:1px; }
  #bds #addBoard { background:none; border:1px dashed var(--line); color:var(--muted); border-radius:7px; padding:5px 10px; font:inherit; cursor:pointer; }
  #bds #addBoard:hover { color:var(--accent); border-color:var(--accent); }
  #tools { display:flex; align-items:center; gap:6px; }
  #tools button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
  #tools button:hover { border-color:var(--accent); }
  #tools button.go { background:var(--accent); color:#0f172a; font-weight:700; border-color:var(--accent); }
  #tools .st { color:var(--muted); font-size:11.5px; min-width:44px; }
  /* 메모판 탭은 맨 위 탭줄 안으로 옮겨진다 */
  #bds { padding:6px 12px; }
  #topnav #bds { max-width:52vw; padding:0; }

  /* 범위 */
  .area { position:absolute; border:2px dashed var(--bd,#64748b); background:var(--tint,rgba(100,116,139,.08)); }
  .area .hd { display:flex; align-items:center; gap:6px; padding:5px 8px; cursor:move; background:rgba(15,23,42,.55); }
  .area .t { flex:1; background:none; border:0; color:var(--bd,#94a3b8); font:inherit; font-size:14px; font-weight:700; padding:2px 4px; border-radius:5px; min-width:40px; }
  .area .t:focus { outline:none; background:rgba(15,23,42,.45); }
  .area .t::placeholder { color:var(--muted); font-weight:400; font-size:12.5px; }

  /* 메모지 (각진 사각형) */
  .note { position:absolute; background:var(--bg2,#fde68a); box-shadow:0 2px 7px rgba(0,0,0,.32); outline:1px solid rgba(0,0,0,.22); outline-offset:-1px; display:flex; flex-direction:column; overflow:hidden; }
  .note.sel { outline:2px solid var(--accent); outline-offset:-2px; box-shadow:0 5px 14px rgba(0,0,0,.45); }
  .note .hd { display:flex; align-items:center; gap:5px; padding:3px 5px; cursor:move; background:rgba(0,0,0,.08); }
  .note .nt { flex:1; min-width:0; color:#1f2937; font-size:12.5px; font-weight:700; padding:1px 3px; cursor:move;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note .nt.no { color:rgba(31,41,55,.38); font-weight:400; }
  .note .hb { background:none; border:0; color:rgba(31,41,55,.5); font:inherit; font-size:13px; line-height:1; cursor:pointer; padding:0 3px; flex:none; }
  .note .hb:hover { color:#0f766e; }
  .note .hb.plus { font-size:15px; }
  /* 제목 줄 두 번 누르면 접힘 (제목만 보임) */
  .note.min { height:auto !important; }
  .note.min textarea, .note.min img, .note.min .rz { display:none; }
  .note img { cursor:move; }
  .note.mv, .area.mv { cursor:grabbing; opacity:.92; }
  .note textarea { flex:1; width:100%; background:none; border:0; resize:none; padding:5px 7px 7px; font-family:inherit; font-size:var(--fs,13px); line-height:1.5; color:#1f2937; }
  .note textarea:focus { outline:none; }
  .note img { flex:1; min-height:0; width:100%; object-fit:contain; background:rgba(0,0,0,.06); user-select:none; }

  .dot { width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.25); cursor:pointer; background:var(--bg2,#fde68a); flex:none; }
  .x { margin-left:auto; background:none; border:0; color:rgba(31,41,55,.45); font:inherit; font-size:14px; line-height:1; cursor:pointer; padding:0 3px; }
  .x:hover { color:#dc2626; }
  .area .x { color:rgba(148,163,184,.6); } .area .x:hover { color:#f87171; }
  .rz { position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; }
  .rz::after { content:''; position:absolute; right:3px; bottom:3px; width:7px; height:7px; border-right:2px solid rgba(0,0,0,.3); border-bottom:2px solid rgba(0,0,0,.3); }
  .area .rz::after { border-color:rgba(148,163,184,.5); }

  /* 팝업 (색·글자 크기 / 보드 메뉴) */
  .pop { position:fixed; z-index:80; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px; box-shadow:0 10px 26px rgba(0,0,0,.5); }
  .pop[hidden] { display:none; }
  .pop .sec { color:var(--muted); font-size:11px; margin:0 0 5px; }
  .pop .cols { display:grid; grid-template-columns:repeat(4,24px); gap:6px; margin-bottom:9px; }
  .pop b.sw { width:24px; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,.3); cursor:pointer; display:block; }
  .pop b.sw:hover { outline:2px solid var(--accent); }
  .pop .sizes { display:flex; gap:5px; align-items:flex-end; }
  .pop .sizes button { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; width:30px; height:30px; cursor:pointer; font-family:inherit; padding:0; line-height:1; }
  .pop .sizes button:hover { border-color:var(--accent); } .pop .sizes button.on { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700; }
  .pop .mi { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); font:inherit; font-size:12.5px; padding:7px 9px; border-radius:6px; cursor:pointer; }
  .pop .mi:hover { background:rgba(148,163,184,.14); } .pop .mi.del { color:#f87171; }
  .pop hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
  .empty { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); color:var(--muted); text-align:center; line-height:1.9; }
</style>
</head>
<body>
<div id="bds"></div>
<div id="bar">
  <div id="tools">
    <button class="go" id="addNote">＋ 새 메모</button>
    <button id="addArea">＋ 새 범위</button>
    <span class="st" id="st"></span>
  </div>
</div>
<div id="board"><div id="canvas"></div></div>
<div class="pop" id="pal" hidden></div>
<div class="pop" id="bmenu" hidden></div>

<script src="common.js"></script>
<script>
MON.renderNav('memo.html');
const $ = (s) => document.querySelector(s);
const esc = MON.esc;
const COLORS = {
  yellow: { bg: '#fde68a', bd: '#d97706' }, green: { bg: '#bbf7d0', bd: '#059669' },
  blue: { bg: '#bfdbfe', bd: '#2563eb' }, pink: { bg: '#fbcfe8', bd: '#db2777' },
  orange: { bg: '#fed7aa', bd: '#ea580c' }, purple: { bg: '#ddd6fe', bd: '#7c3aed' },
  gray: { bg: '#e2e8f0', bd: '#475569' }, white: { bg: '#f8fafc', bd: '#94a3b8' },
};
const KEYS = Object.keys(COLORS);
const SIZES = [11, 13, 15, 18, 22];
const SNAP = 10;
const snap = (v) => Math.round(v / SNAP) * SNAP;
const tint = (c) => { const h = COLORS[c] ? COLORS[c].bd : '#64748b'; const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},.10)`; };
const EMPTY = '<div class="empty">메모가 없습니다.<br>위쪽 <b>＋ 새 메모</b> 를 눌러 붙이세요. <b>사진은 복사한 뒤 Ctrl+V</b> 로 바로 붙습니다.<br>'
  + '<span style="font-size:12px">메모는 아무 데나 끌어서 옮기고, 오른쪽 아래 모서리로 크기를 바꿉니다.<br>'
  + '제목 줄의 <b>✎</b> 로 제목을 정하고, <b>＋</b> 를 누르면 그 옆에 새 메모가 붙습니다.<br>'
  + '제목 줄을 <b>두 번 누르면</b> 접혀서 제목만 보입니다.<br>'
  + '색 동그라미를 누르면 색과 글자 크기를 정할 수 있고, 맨 위 탭에서 메모판을 여러 개 만들 수 있습니다.</span></div>';

let boards = [], active = '', sel = null;
let dirty = false, saving = false;
const uid = () => Math.random().toString(36).slice(2, 10);
const cur = () => boards.find((b) => b.id === active) || boards[0] || { notes: [], areas: [] };

// ---- 그리기 ----
function render() {
  const b = cur(), cv = $('#canvas');
  let maxX = 0, maxY = 0;
  for (const o of b.areas.concat(b.notes)) { maxX = Math.max(maxX, o.x + o.w); maxY = Math.max(maxY, o.y + o.h); }
  cv.style.minWidth = Math.max($('#board').clientWidth - 4, maxX + 320) + 'px';
  cv.style.minHeight = Math.max($('#board').clientHeight - 60, maxY + 320) + 'px';
  cv.innerHTML = b.areas.map((a) => `
    <div class="area" data-k="a" data-id="${a.id}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;--bd:${COLORS[a.color] ? COLORS[a.color].bd : '#64748b'};--tint:${tint(a.color)}">
      <div class="hd"><span class="dot" data-pal="1" style="--bg2:${COLORS[a.color] ? COLORS[a.color].bd : '#64748b'}"></span>
        <input class="t" value="${esc(a.title)}" placeholder="범위 이름 (예: 아이디어)" maxlength="40">
        <button class="x" title="범위 지우기">✕</button></div>
      <div class="rz"></div>
    </div>`).join('') +
    b.notes.map((n) => `
    <div class="note ${sel === n.id ? 'sel' : ''} ${n.min ? 'min' : ''}" data-k="n" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;z-index:${10 + (n.z || 1)};--bg2:${COLORS[n.color] ? COLORS[n.color].bg : '#fde68a'};--fs:${n.fs || 13}px">
      <div class="hd" title="두 번 누르면 접었다 폈다 합니다"><span class="dot" data-pal="1"></span>
        <span class="nt ${n.title ? '' : 'no'}">${esc(n.title || '제목 없음')}</span>
        <button class="hb ed" title="제목 정하기">✎</button>
        <button class="hb plus" title="옆에 새 메모">＋</button><button class="x" title="메모 지우기">✕</button></div>
      ${n.img ? `<img src="${n.img}" draggable="false" alt="">` : `<textarea placeholder="메모를 적으세요">${esc(n.text)}</textarea>`}
      <div class="rz"></div>
    </div>`).join('') +
    (b.notes.length + b.areas.length ? '' : EMPTY);
  renderBoards();
}
function renderBoards() {
  $('#bds').innerHTML = boards.map((b) => `<button class="bd ${b.id === active ? 'on' : ''}" data-b="${b.id}">
    <i style="background:${COLORS[b.color] ? COLORS[b.color].bg : '#fde68a'}"></i>${esc(b.name)}${b.id === active ? '<span class="mn">▾</span>' : ''}</button>`).join('')
    + `<button id="addBoard" title="메모판 추가">＋</button>`;
}
const find = (k, id) => (k === 'n' ? cur().notes : cur().areas).find((o) => o.id === id);
const topZ = () => cur().notes.reduce((m, n) => Math.max(m, n.z || 1), 1);
function viewCenter() { const b = $('#board'); return { x: Math.round(b.scrollLeft + b.clientWidth / 2), y: Math.round(b.scrollTop + b.clientHeight / 2) }; }

// ---- 만들기 ----
function newNote(x, y) {
  const n = { id: uid(), x: Math.max(0, snap(x)), y: Math.max(0, snap(y)), w: 200, h: 200, title: '', text: '', color: 'yellow', z: topZ() + 1, fs: 13 };
  cur().notes.push(n); sel = n.id; touch(); render();
  const el = document.querySelector(`.note[data-id="${n.id}"] textarea`); if (el) el.focus();
}
$('#addNote').onclick = () => {
  const c = viewCenter(), k = cur().notes.length;
  newNote(c.x - 100 + (k % 5) * 20, c.y - 100 + (k % 5) * 20);
};
$('#addArea').onclick = () => {
  const c = viewCenter(), a = { id: uid(), x: Math.max(0, snap(c.x - 260)), y: Math.max(0, snap(c.y - 190)), w: 520, h: 380, title: '', color: 'green' };
  cur().areas.push(a); touch(); render();
  const el = document.querySelector(`.area[data-id="${a.id}"] .t`); if (el) el.focus();
};

// ---- 사진 붙여넣기 (Ctrl+V) ----
function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        ok({ url: cv.toDataURL('image/jpeg', q), w, h });
      };
      im.onerror = no; im.src = fr.result;
    };
    fr.onerror = no; fr.readAsDataURL(file);
  });
}
document.addEventListener('paste', async (e) => {
  const items = e.clipboardData && e.clipboardData.items ? [...e.clipboardData.items] : [];
  const it = items.find((x) => x.type && x.type.startsWith('image/'));
  if (!it) return;                                  // 글자 붙여넣기는 그대로 둔다
  e.preventDefault();
  const file = it.getAsFile(); if (!file) return;
  $('#st').textContent = '사진 넣는 중';
  try {
    const im = await shrink(file, 1000, 0.82);
    const used = JSON.stringify(boards).length;
    if (used + im.url.length > 34 * 1024 * 1024) { alert('사진이 너무 많습니다. 오래된 사진 메모를 지운 뒤 다시 붙여넣어 주세요.'); $('#st').textContent = ''; return; }
    const c = viewCenter();
    const s = Math.min(1, 320 / Math.max(im.w, im.h));
    const w = Math.max(80, snap(im.w * s)), h = Math.max(60, snap(im.h * s) + 22);
    cur().notes.push({ id: uid(), x: Math.max(0, snap(c.x - w / 2)), y: Math.max(0, snap(c.y - h / 2)), w, h, title: '', text: '', img: im.url, color: 'white', z: topZ() + 1, fs: 13 });
    touch(); render();
  } catch (err) { alert('사진을 넣지 못했습니다: ' + err.message); $('#st').textContent = ''; }
});

// ---- 클릭 ----
$('#canvas').addEventListener('click', (e) => {
  const box = e.target.closest('[data-k]'); if (!box) { sel = null; render(); return; }
  const k = box.dataset.k, id = box.dataset.id, o = find(k, id); if (!o) return;
  if (e.target.classList.contains('x')) {
    const has = k === 'n' ? ((o.text || '').trim() || (o.title || '').trim() || o.img) : (o.title || '').trim();
    if (has && !confirm(k === 'n' ? '이 메모를 지울까요?' : '이 범위를 지울까요? (안에 있는 메모는 그대로 남습니다)')) return;
    if (k === 'n') cur().notes = cur().notes.filter((x) => x.id !== id); else cur().areas = cur().areas.filter((x) => x.id !== id);
    sel = null; touch(); render(); return;
  }
  if (e.target.classList.contains('ed')) {       // 제목 정하기
    const v = prompt('메모 제목', o.title || '');
    if (v != null) { o.title = v.trim().slice(0, 60); o.updated = Date.now(); touch(); render(); }
    return;
  }
  if (e.target.classList.contains('plus')) {     // 이 메모 옆에 새 메모
    const right = o.x + o.w + 10, below = o.y + o.h + 10;
    if (right + 200 < ($('#canvas').clientWidth || 4000)) newNote(right, o.y); else newNote(o.x, below);
    return;
  }
  if (e.target.dataset.pal) { openPal(e.target, k, id); return; }
  if (k === 'n' && sel !== id) { sel = id; o.z = topZ() + 1; touch(); render(); }
});
$('#canvas').addEventListener('dblclick', (e) => {          // 제목 줄 두 번 누르면 접었다 폈다
  const hd = e.target.closest('.hd'); if (!hd || e.target.closest('button') || e.target.dataset.pal) return;
  const box = e.target.closest('[data-k]'); if (!box || box.dataset.k !== 'n') return;
  const o = find('n', box.dataset.id); if (!o) return;
  o.min = !o.min; touch(); render();
});
$('#canvas').addEventListener('input', (e) => {
  const box = e.target.closest('[data-k]'); if (!box) return;
  const o = find(box.dataset.k, box.dataset.id); if (!o) return;
  if (e.target.tagName === 'TEXTAREA') { o.text = e.target.value; o.updated = Date.now(); }
  else if (e.target.classList.contains('t')) { o.title = e.target.value; }
  touch();
});

// ---- 옮기기 · 크기 ----
// 메모지는 아무 데나(글자 위에서도) 끌면 옮겨진다. 4px 넘게 움직여야 옮기기로 보고,
// 그냥 누르기만 하면 평소대로 글자 칸에 커서가 들어간다.
let drag = null, pend = null;
$('#canvas').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const box = e.target.closest('[data-k]'); if (!box) return;
  const k = box.dataset.k, o = find(k, box.dataset.id); if (!o) return;
  const t = e.target;
  if (t.tagName === 'BUTTON' || t.dataset.pal) return;               // 지우기·＋·제목·색 단추
  const rz = t.classList.contains('rz');
  if (!rz) {
    if (t.tagName === 'INPUT') return;                               // 범위 이름 칸
    if (k === 'a' && !t.closest('.hd')) return;                      // 범위는 제목 줄로만 옮긴다
  }
  const base = { o, box, k, sx: e.clientX, sy: e.clientY, x: o.x, y: o.y, w: o.w, h: o.h };
  if (rz) { e.preventDefault(); drag = { ...base, mode: 'rz' }; document.body.style.userSelect = 'none'; }
  else pend = { ...base, mode: 'mv' };
  if (k === 'n' && sel !== o.id) { sel = o.id; o.z = topZ() + 1; box.style.zIndex = 10 + o.z; box.classList.add('sel'); touch(); }
});
document.addEventListener('mousemove', (e) => {
  if (pend && (Math.abs(e.clientX - pend.sx) > 4 || Math.abs(e.clientY - pend.sy) > 4)) {
    drag = pend; pend = null;
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (err) {}
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    document.body.style.userSelect = 'none'; drag.box.classList.add('mv');
  }
  if (!drag) return;
  e.preventDefault();
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.mode === 'mv') {
    drag.o.x = Math.max(0, snap(drag.x + dx)); drag.o.y = Math.max(0, snap(drag.y + dy));
    drag.box.style.left = drag.o.x + 'px'; drag.box.style.top = drag.o.y + 'px';
  } else {
    const min = drag.k === 'n' ? [80, 60] : [160, 120];
    drag.o.w = Math.max(min[0], snap(drag.w + dx)); drag.o.h = Math.max(min[1], snap(drag.h + dy));
    drag.box.style.width = drag.o.w + 'px'; drag.box.style.height = drag.o.h + 'px';
  }
});
document.addEventListener('mouseup', () => {
  pend = null;
  if (!drag) return;
  drag.box.classList.remove('mv'); drag = null; document.body.style.userSelect = ''; touch(); render();
});

// ---- 색 · 글자 크기 ----
let palFor = null;
function openPal(el, k, id) {
  palFor = { k, id };
  const o = find(k, id) || {};
  const r = el.getBoundingClientRect();
  $('#pal').innerHTML = '<div class="sec">색</div><div class="cols">'
    + KEYS.map((c) => `<b class="sw" data-c="${c}" style="background:${k === 'n' ? COLORS[c].bg : COLORS[c].bd}"></b>`).join('') + '</div>'
    + (k === 'n' && !o.img ? '<div class="sec">글자 크기</div><div class="sizes">'
      + SIZES.map((f) => `<button type="button" data-f="${f}" class="${(o.fs || 13) === f ? 'on' : ''}" style="font-size:${Math.min(17, f)}px">가</button>`).join('') + '</div>' : '');
  $('#pal').style.left = Math.min(window.innerWidth - 190, r.left) + 'px';
  $('#pal').style.top = Math.min(window.innerHeight - 190, r.bottom + 6) + 'px';
  $('#pal').hidden = false;
}
$('#pal').onclick = (e) => {
  if (!palFor) return;
  const o = find(palFor.k, palFor.id); if (!o) return;
  const c = e.target.dataset.c, f = e.target.dataset.f;
  if (c) { o.color = c; touch(); render(); $('#pal').hidden = true; palFor = null; return; }
  if (f) { o.fs = Number(f); touch(); render(); const d = document.querySelector(`[data-id="${palFor.id}"] .dot`); if (d) openPal(d, palFor.k, palFor.id); }
};

// ---- 메모판(보드) ----
$('#bds').addEventListener('click', (e) => {
  if (e.target.closest('#addBoard')) {
    if (boards.length >= 20) { alert('메모판은 20개까지 만들 수 있습니다.'); return; }
    const b = { id: uid(), name: `메모 ${boards.length + 1}`, color: KEYS[boards.length % KEYS.length], notes: [], areas: [] };
    boards.push(b); active = b.id; sel = null; touch(); render(); return;
  }
  const chip = e.target.closest('.bd'); if (!chip) return;
  const id = chip.dataset.b;
  if (id === active) { openBoardMenu(chip); return; }   // 지금 보고 있는 판을 다시 누르면 메뉴
  active = id; sel = null; $('#board').scrollTo(0, 0); touch(); render();
});
function openBoardMenu(chip) {
  const b = boards.find((x) => x.id === active); if (!b) return;
  const i = boards.indexOf(b), r = chip.getBoundingClientRect();
  $('#bmenu').innerHTML = `<div class="sec">${esc(b.name)}</div>
    <button class="mi" data-m="rename">이름 바꾸기</button>
    <div class="sec" style="margin-top:6px">색</div><div class="cols">${KEYS.map((c) => `<b class="sw" data-c="${c}" style="background:${COLORS[c].bg}"></b>`).join('')}</div>
    <hr><button class="mi" data-m="left"${i === 0 ? ' disabled style="opacity:.4"' : ''}>◀ 왼쪽으로 옮기기</button>
    <button class="mi" data-m="right"${i === boards.length - 1 ? ' disabled style="opacity:.4"' : ''}>오른쪽으로 옮기기 ▶</button>
    <hr><button class="mi del" data-m="del">이 메모판 지우기</button>`;
  $('#bmenu').style.left = Math.min(window.innerWidth - 210, Math.max(8, r.left)) + 'px';
  $('#bmenu').style.top = (r.bottom + 6) + 'px';
  $('#bmenu').hidden = false;
}
$('#bmenu').onclick = (e) => {
  const b = boards.find((x) => x.id === active); if (!b) return;
  const c = e.target.dataset.c, m = e.target.dataset.m;
  if (c) { b.color = c; touch(); renderBoards(); $('#bmenu').hidden = true; return; }
  if (!m) return;
  const i = boards.indexOf(b);
  if (m === 'rename') { const v = prompt('메모판 이름', b.name); if (v != null && v.trim()) { b.name = v.trim().slice(0, 20); touch(); renderBoards(); } }
  else if (m === 'left' && i > 0) { boards.splice(i, 1); boards.splice(i - 1, 0, b); touch(); renderBoards(); }
  else if (m === 'right' && i < boards.length - 1) { boards.splice(i, 1); boards.splice(i + 1, 0, b); touch(); renderBoards(); }
  else if (m === 'del') {
    if (boards.length <= 1) { alert('메모판이 하나뿐이라 지울 수 없습니다.'); return; }
    if (!confirm(`"${b.name}" 메모판을 지울까요? 안에 있는 메모 ${b.notes.length}개도 함께 지워집니다.`)) return;
    boards.splice(i, 1); active = boards[Math.max(0, i - 1)].id; sel = null; touch(); render();
  }
  $('#bmenu').hidden = true;
};
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('#pal') && !e.target.dataset.pal) { $('#pal').hidden = true; palFor = null; }
  if (!e.target.closest('#bmenu') && !e.target.closest('.bd')) $('#bmenu').hidden = true;
});

// ---- 저장 ----
let timer = null;
function touch() { dirty = true; $('#st').textContent = '저장 대기'; clearTimeout(timer); timer = setTimeout(saveNow, 700); }
async function saveNow() {
  if (!dirty || saving) return;
  saving = true; $('#st').textContent = '저장 중';
  const body = JSON.stringify({ boards, active });
  dirty = false;
  try {
    const r = await fetch('api/memo', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '저장 실패');
    $('#st').textContent = '저장됨';
  } catch (e) { dirty = true; $('#st').textContent = '저장 실패'; }
  saving = false;
  if (dirty) setTimeout(saveNow, 1500);
}
window.addEventListener('beforeunload', () => {
  if (!dirty) return;
  try { fetch('api/memo', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ boards, active }), keepalive: true }); } catch (e) {}
});
window.addEventListener('resize', render);

// ---- 메모판 탭·도구를 맨 위 탭줄 안으로 (공통 상단바가 그려진 뒤) ----
// 상단바의 "메모" 탭 자리를 메모판 탭(메모 1, 메모 2 …)이 대신한다. 별도 줄을 쓰지 않는다.
(function mountBar() {
  let tries = 0;
  const t = setInterval(() => {
    const tabs = document.getElementById('navtabs');
    const my = tabs && tabs.querySelector('a[data-page="memo.html"]');
    if (my) {
      my.remove();
      tabs.appendChild($('#bds'));
      clearInterval(t); render();
    } else if (++tries > 60) clearInterval(t);   // 상단바가 없으면(창 안에 끼워 쓸 때) 그대로 둔다
  }, 50);
})();

(async () => {
  const r = await fetch('api/memo');
  if (r.status === 401) { location.href = 'login.html'; return; }
  if (r.status === 403) { location.href = 'home.html?denied=memo.html'; return; }
  const j = await r.json();
  boards = j.boards || []; active = j.active || (boards[0] && boards[0].id) || '';
  render();
})();
</script>
</body>
</html>
