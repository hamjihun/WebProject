<style>

  /* 메모 안 스크롤바는 평소엔 투명하게 떠 있다가, 마우스를 올리면 살짝 보인다 */

  html, body { height:100%; }

  /* 메모판 탭은 맨 위 탭줄 안으로 옮겨진다 */

    font:inherit; font-size:12px; padding:6px 14px; cursor:pointer; }
  #help .ft button:hover { border-color:var(--accent); color:var(--accent); background:var(--soft); }
  #cfg .hlp { width:100%; margin-top:12px; background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:var(--r); font:inherit; font-size:12px; padding:7px 0; cursor:pointer; }
  #cfg .hlp:hover { border-color:var(--accent); color:var(--accent); background:var(--soft); }
</style>
</head>
<body>
<div id="bds"></div>
<div id="bar">
  <div id="tools">
    <div class="tl"></div>
    <div class="tc">
      <button class="go" id="addNote">＋ 새 메모</button>

      <button id="cfgBtn" title="메모 기본 설정">⚙</button>

</div>

<script>try { const t = localStorage.getItem('imsMemoTheme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="common.js"></script>
<script>
MON.renderNav('memo.html');
const $ = (s) => document.querySelector(s);
const esc = MON.esc;
const COLORS = {
  yellow: { bg: '#fde68a', bd: '#d97706' }, green: { bg: '#bbf7d0', bd: '#059669' },
  blue: { bg: '#bfdbfe', bd: '#2563eb' }, pink: { bg: '#fbcfe8', bd: '#db2777' },
  orange: { bg: '#fed7aa', bd: '#ea580c' }, purple: { bg: '#ddd6fe', bd: '#7c3aed' },
  gray: { bg: '#e2e8f0', bd: '#475569' }, white: { bg: '#f8fafc', bd: '#94a3b8' },
};
const KEYS = Object.keys(COLORS);
const SIZES = [8, 9, 10, 11, 12, 14, 16, 18, 20, 24, 28, 32, 36, 40, 48, 56, 64, 72];   // 워드처럼 흔히 쓰는 눈금
const FS_MIN = 8, FS_MAX = 72;
const fsFix = (v) => Math.min(FS_MAX, Math.max(FS_MIN, Math.round(Number(v) || 13)));
function fsStep(v, dir) {                                    // − / ＋ 는 눈금 단위로 움직인다
  v = fsFix(v);
  if (dir > 0) return fsFix(SIZES.find((x) => x > v) || FS_MAX);
  const lower = SIZES.filter((x) => x < v);
  return fsFix(lower.length ? lower[lower.length - 1] : FS_MIN);
}
function fsBox(v) {
  return `<div class="fsz"><button type="button" data-fs="-" title="작게">−</button>
    <input class="fi" type="number" min="${FS_MIN}" max="${FS_MAX}" step="1" value="${fsFix(v)}"><span class="u">pt</span>
    <button type="button" data-fs="+" title="크게">＋</button></div>`;
}
const SNAP = 10;
const snap = (v) => Math.round(v / SNAP) * SNAP;
const tint = (c) => { const h = COLORS[c] ? COLORS[c].bd : '#64748b'; const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},.10)`; };
let boards = [], active = '', sel = null;
let trash = [];                                                   // 휴지통 (메모판 공용, 사람마다 하나)
let prefs = { color: 'yellow', fs: 13, w: 200, h: 200, acolor: 'green', magnet: true, side: true, theme: 'light' };
function applyTheme() {                                        // 밝게 / 어둡게
  const d = prefs.theme === 'dark';
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  try { localStorage.setItem('imsMemoTheme', d ? 'dark' : 'light'); } catch (e) {}   // 일정 화면도 같은 테마로
}   // 기본 설정
let dirty = false, saving = false;
const uid = () => Math.random().toString(36).slice(2, 10);
const curB = () => boards.find((x) => x.id === active) || boards[0] || { pages: [] };   // 상단 탭 = 메모판
const cur = () => {                                                                     // 왼쪽 탭 = 그 안의 쪽
  const b = curB();
  if (!Array.isArray(b.pages) || !b.pages.length) {
    b.pages = [{ id: uid(), name: b.name || '메모', notes: b.notes || [], areas: b.areas || [], links: b.links || [] }];
    delete b.notes; delete b.areas; delete b.links;
  }
  const g = b.pages.find((x) => x.id === b.ap) || b.pages[0];
  b.ap = g.id;
  if (!Array.isArray(g.notes)) g.notes = [];
  if (!Array.isArray(g.areas)) g.areas = [];
  if (!Array.isArray(g.links)) g.links = [];
  return g;
};

const body = (n) => (n.html ? n.html : esc(n.text || '').replace(/\n/g, '<br>'));   // 예전 메모(글자만)도 그대로 보인다

// ---- 그리기 ----
function render() {
  const b = cur(), cv = $('#canvas');
  let maxX = 0, maxY = 0;
  for (const o of b.areas.concat(b.links, b.notes)) { maxX = Math.max(maxX, o.x + o.w); maxY = Math.max(maxY, o.y + o.h); }
  cv.style.minWidth = Math.max($('#board').clientWidth - 4, maxX + 320) + 'px';
  cv.style.minHeight = Math.max($('#board').clientHeight - 60, maxY + 320) + 'px';
  cv.innerHTML = b.areas.map((a) => `
    <div class="area" data-k="a" data-id="${a.id}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;--bd:${COLORS[a.color] ? COLORS[a.color].bd : '#64748b'};--tint:${tint(a.color)}">
      <div class="hd"><span class="dot" data-pal="1" style="--bg2:${COLORS[a.color] ? COLORS[a.color].bd : '#64748b'}"></span>
        <input class="t" value="${esc(a.title)}" placeholder="범위 이름 (예: 아이디어)" maxlength="40">
        <button class="x" title="범위 지우기">✕</button></div>
      <div class="rz se"></div><div class="rz sw"></div><div class="rz e"></div><div class="rz w"></div><div class="rz s"></div>
    </div>`).join('') +
    b.links.map((l) => `
    <div class="lnk ${sel === l.id ? 'sel' : ''}" data-k="l" data-id="${l.id}" title="${esc(l.url || '')}"
      style="left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px">
      ${icoHtml(l)}<span class="lb">${esc(l.name || '이름 없음')}</span>
      <button class="x" title="링크 지우기">✕</button>
    </div>`).join('') +
    b.notes.map((n) => `
    <div class="note ${sel === n.id ? 'sel' : ''} ${n.min ? 'min' : ''}" data-k="n" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;z-index:${10 + (n.z || 1)};--bg2:${COLORS[n.color] ? COLORS[n.color].bg : '#fde68a'};--fs:${n.fs || 13}px">
      <div class="hd" title="두 번 누르면 접었다 폈다 합니다"><button class="hb plus" title="옆에 새 메모">＋</button>
        <span class="nt ${n.title ? '' : 'no'}">${esc(n.title || '제목 없음')}</span>
        <button class="hb ed" title="제목 정하기 (오른쪽 단추 = 색·글자 크기)">✎</button>
        <button class="x" title="메모 지우기">✕</button></div>
      ${n.img ? `<img src="${n.img}" draggable="false" alt="">`
        : `<div class="tx" contenteditable="true" spellcheck="false" data-ph="메모를 적으세요">${body(n)}</div>`}
      <div class="rz se"></div><div class="rz sw"></div><div class="rz e"></div><div class="rz w"></div><div class="rz s"></div>
    </div>`).join('') +
    '';
  renderBoards(); renderPages();
  $('#binN').textContent = trash.length ? ' ' + trash.length : '';
}
// 링크 아이콘: 이모지를 넣었으면 그것, 아니면 그 사이트 그림, 안 나오면 첫 글자
function icoHtml(l) {
  if (l.icon) return `<span class="ic">${esc(l.icon)}</span>`;
  let org = '';
  try { org = new URL(l.url).origin; } catch (e) {}
  const ch = esc(((l.name || '').trim()[0] || '·').toUpperCase());
  if (!org) return `<span class="ic">🔗</span>`;
  return `<span class="ic"><img src="${esc(org)}/favicon.ico" alt="" draggable="false"
    onerror="this.parentNode.textContent='${ch}'"></span>`;
}
function renderBoards() {
  $('#bds').innerHTML = boards.map((b) => `<button class="bd ${b.id === active ? 'on' : ''}" data-b="${b.id}">
    <i style="background:${COLORS[b.color] ? COLORS[b.color].bg : '#fde68a'}"></i>${esc(b.name)}${b.id === active ? '<span class="mn">▾</span>' : ''}</button>`).join('')
    + `<button id="addBoard" title="메모판 추가">＋</button>`;
}
// ---- 왼쪽 탭 (메모판 안의 쪽) ----
function renderPages() {
  const b = curB();
  cur();                                                  // pages 보장
  $('#sdName').textContent = b.name || '';
  $('#pgs').innerHTML = (b.pages || []).map((g) => `<button class="pg ${g.id === b.ap ? 'on' : ''}" data-p="${g.id}"
    title="${esc(g.name)}"><i></i><span class="nm">${esc(g.name)}</span></button>`).join('');
  document.body.classList.toggle('nosd', prefs.side === false);
  applyTheme();
}
const sideToggle = () => { prefs.side = prefs.side === false; touch(); render(); };
$('#sdHide').onclick = sideToggle;
$('#sdShow').onclick = sideToggle;
$('#addPage').onclick = () => {
  const b = curB();
  if (b.pages.length >= 50) { alert('탭은 50개까지 만들 수 있습니다.'); return; }
  const g = { id: uid(), name: `새 탭 ${b.pages.length + 1}`, notes: [], areas: [], links: [] };
  b.pages.push(g); b.ap = g.id; sel = null; prefs.side = true; touch(); render();
  renamePage(document.querySelector(`.pg[data-p="${g.id}"]`));
};
$('#pgs').addEventListener('click', (e) => {
  const el = e.target.closest('.pg'); if (!el || e.target.tagName === 'INPUT') return;
  const b = curB();
  if (el.dataset.p === b.ap) { openPageMenu(el); return; }       // 보고 있는 탭을 다시 누르면 메뉴
  b.ap = el.dataset.p; sel = null; $('#board').scrollTo(0, 0); touch(); render();
});
$('#pgs').addEventListener('dblclick', (e) => {
  const el = e.target.closest('.pg'); if (!el || el.querySelector('input')) return;
  $('#pmenu').hidden = true; renamePage(el);
});
$('#pgs').addEventListener('contextmenu', (e) => {
  const el = e.target.closest('.pg'); if (!el) return;
  e.preventDefault(); curB().ap = el.dataset.p; render(); openPageMenu(document.querySelector(`.pg[data-p="${el.dataset.p}"]`));
});
function renamePage(el) {
  const b = curB(), g = b.pages.find((x) => x.id === (el && el.dataset.p)); if (!g) return;
  el.innerHTML = `<input class="re" maxlength="30" value="${esc(g.name)}">`;
  const i = el.querySelector('input'); i.focus(); i.select();
  let done = false;
  const end = (ok) => {
    if (done) return; done = true;
    if (ok && i.value.trim()) { g.name = i.value.trim().slice(0, 30); touch(); }
    renderPages();
  };
  i.onblur = () => end(true);
  i.onkeydown = (ev) => { if (ev.key === 'Enter') end(true); else if (ev.key === 'Escape') end(false); ev.stopPropagation(); };
}
function openPageMenu(el) {
  const b = curB(), g = b.pages.find((x) => x.id === b.ap); if (!g || !el) return;
  const i = b.pages.indexOf(g), r = el.getBoundingClientRect();
  $('#pmenu').innerHTML = `<div class="sec">${esc(g.name)}</div>
    <button class="mi" data-m="rename">이름 바꾸기</button>
    <hr><button class="mi" data-m="up"${i === 0 ? ' disabled style="opacity:.4"' : ''}>▲ 위로 옮기기</button>
    <button class="mi" data-m="down"${i === b.pages.length - 1 ? ' disabled style="opacity:.4"' : ''}>▼ 아래로 옮기기</button>
    <hr><button class="mi del" data-m="del">이 탭 지우기</button>`;
  $('#pmenu').style.left = Math.min(window.innerWidth - 210, r.right + 6) + 'px';
  $('#pmenu').style.top = Math.min(window.innerHeight - 200, r.top) + 'px';
  $('#pmenu').hidden = false;
}
$('#pmenu').onclick = (e) => {
  const m = e.target.dataset.m; if (!m) return;
  const b = curB(), g = b.pages.find((x) => x.id === b.ap), i = b.pages.indexOf(g);
  $('#pmenu').hidden = true;
  if (m === 'rename') { renamePage(document.querySelector(`.pg[data-p="${g.id}"]`)); return; }
  if (m === 'up' && i > 0) { b.pages.splice(i, 1); b.pages.splice(i - 1, 0, g); touch(); render(); }
  else if (m === 'down' && i < b.pages.length - 1) { b.pages.splice(i, 1); b.pages.splice(i + 1, 0, g); touch(); render(); }
  else if (m === 'del') {
    if (b.pages.length <= 1) { alert('탭이 하나뿐이라 지울 수 없습니다.'); return; }
    const n = g.notes.length + g.areas.length + g.links.length;
    if (n && !confirm(`"${g.name}" 탭을 지울까요? 안에 있는 ${n}개도 함께 지워집니다. (되돌릴 수 없습니다)`)) return;
    b.pages.splice(i, 1); b.ap = b.pages[Math.max(0, i - 1)].id; sel = null; touch(); render();
  }
};

// ---- 자석 (딱딱 떨어지게 붙이기) ----
const MAG = 14;                                  // 이 거리 안이면 자석처럼 붙는다
const NEAR = 60;                                 // 다른 축으로 이만큼 가까운 것만 상대로 본다
const bh = (o, k) => (k === 'n' && o.min ? 26 : o.h);
const geo = (o, k) => ({ id: o.id, x: o.x, y: o.y, w: o.w, h: bh(o, k) });
function others(id) {
  return cur().notes.filter((n) => n.id !== id).map((n) => geo(n, 'n'))
    .concat(cur().links.filter((l) => l.id !== id).map((l) => geo(l, 'l')))
    .concat(cur().areas.filter((a) => a.id !== id).map((a) => geo(a, 'a')));
}
function magnet(o, k, x, y) {
  if (!prefs.magnet) return { x: Math.max(0, snap(x)), y: Math.max(0, snap(y)) };
  const w = o.w, h = bh(o, k);
  let bx = { d: MAG + 1, v: x }, by = { d: MAG + 1, v: y };
  for (const t of others(o.id)) {
    if (y < t.y + t.h + NEAR && t.y < y + h + NEAR) {
      for (const v of [t.x + t.w, t.x - w, t.x, t.x + t.w - w]) { const d = Math.abs(v - x); if (d < bx.d) bx = { d, v }; }
    }
    if (x < t.x + t.w + NEAR && t.x < x + w + NEAR) {
      for (const v of [t.y + t.h, t.y - h, t.y, t.y + t.h - h]) { const d = Math.abs(v - y); if (d < by.d) by = { d, v }; }
    }
  }
  return { x: Math.max(0, Math.round(bx.d <= MAG ? bx.v : snap(x))), y: Math.max(0, Math.round(by.d <= MAG ? by.v : snap(y))) };
}
const hits = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function unstack(o, k) {                         // 겹쳐 있으면 가장 가까운 쪽으로 밀어 딱 붙인다
  if (k === 'a' || !prefs.magnet) return;
  const me = geo(o, k), list = cur().notes.filter((n) => n.id !== o.id).map((n) => geo(n, 'n'))
    .concat(cur().links.filter((l) => l.id !== o.id).map((l) => geo(l, 'l')));
  for (let i = 0; i < 8; i++) {
    const t = list.find((b) => hits(me, b)); if (!t) break;
    const c = [{ a: 'x', v: t.x + t.w }, { a: 'x', v: t.x - me.w }, { a: 'y', v: t.y + t.h }, { a: 'y', v: t.y - me.h }]
      .filter((p) => p.v >= 0).map((p) => ({ ...p, d: Math.abs(p.v - me[p.a]) })).sort((a, b) => a.d - b.d)[0];
    if (!c) break;
    me[c.a] = c.v;
  }
  o.x = Math.max(0, Math.round(me.x)); o.y = Math.max(0, Math.round(me.y));
}

const find = (k, id) => (k === 'n' ? cur().notes : k === 'l' ? cur().links : cur().areas).find((o) => o.id === id);
const topZ = () => cur().notes.reduce((m, n) => Math.max(m, n.z || 1), 1);
function viewCenter() { const b = $('#board'); return { x: Math.round(b.scrollLeft + b.clientWidth / 2), y: Math.round(b.scrollTop + b.clientHeight / 2) }; }

// ---- 만들기 ----
function newNote(x, y) {
  const n = { id: uid(), x: Math.max(0, snap(x)), y: Math.max(0, snap(y)), w: prefs.w, h: prefs.h, title: '', text: '', color: prefs.color, z: topZ() + 1, fs: prefs.fs };
  cur().notes.push(n); unstack(n, 'n'); sel = n.id; touch(); render();
  const el = document.querySelector(`.note[data-id="${n.id}"] .tx`); if (el) el.focus();
}
$('#addNote').onclick = () => {
  const c = viewCenter(), k = cur().notes.length;
  newNote(c.x - prefs.w / 2 + (k % 5) * 20, c.y - prefs.h / 2 + (k % 5) * 20);
};
$('#addEtc').onclick = () => {
  if (!$('#etc').hidden) { $('#etc').hidden = true; return; }
  $('#etc').innerHTML = '<button class="mi" data-e="link">🔗 링크 아이콘 만들기</button>';
  const r = $('#addEtc').getBoundingClientRect();
  $('#etc').style.left = Math.max(8, Math.min(window.innerWidth - 200, r.left)) + 'px';
  $('#etc').style.top = (r.bottom + 6) + 'px';
  $('#etc').hidden = false;
};
$('#etc').onclick = (e) => {
  if (e.target.dataset.e !== 'link') return;
  $('#etc').hidden = true;
  const c = viewCenter(); newLink(c.x, c.y);
};
function newLink(x, y) {
  const l = { id: uid(), x: Math.max(0, snap(x - 48)), y: Math.max(0, snap(y - 44)), w: 96, h: 88, name: '', url: '', icon: '', color: 'gray' };
  cur().links.push(l); unstack(l, 'l'); sel = l.id; touch(); render();
  const el = document.querySelector(`.lnk[data-id="${l.id}"]`); if (el) openLnkEd(el, l.id);
}
let lnkFor = null;
function openLnkEd(el, id) {
  const l = find('l', id); if (!l) return;
  lnkFor = id;
  const r = el.getBoundingClientRect ? el.getBoundingClientRect() : el;
  $('#lnkEd').innerHTML = `<div class="sec">이름</div>
    <input class="nm" maxlength="30" placeholder="예: 그룹웨어" value="${esc(l.name || '')}">
    <div class="sec" style="margin-top:9px">주소</div>
    <input class="ur" maxlength="500" placeholder="gw.ilsancorp.co.kr" value="${esc(l.url || '')}">
    <div class="sec" style="margin-top:9px">아이콘 (이모지, 비우면 자동)</div>
    <input class="ik" maxlength="4" placeholder="예: 📁 ⭐ 📊" value="${esc(l.icon || '')}">
    <button class="go2">저장</button>
    <div class="tip">주소만 적으면 <b>https://</b> 는 자동으로 붙습니다. 아이콘은 그 사이트 그림을 자동으로 가져옵니다.</div>`;
  $('#lnkEd').style.left = Math.max(8, Math.min(window.innerWidth - 290, r.left)) + 'px';
  $('#lnkEd').style.top = Math.min(window.innerHeight - 300, r.bottom + 6) + 'px';
  $('#lnkEd').hidden = false;
  const n = $('#lnkEd .nm'); if (n) { n.focus(); n.select(); }
}
function saveLnk() {
  const l = find('l', lnkFor); if (!l) return;
  let u = $('#lnkEd .ur').value.trim();
  if (u) u = /^https?:\/\//i.test(u) ? u : 'https://' + u.replace(/^\/+/, '');
  l.url = u; l.icon = $('#lnkEd .ik').value.trim().slice(0, 4);
  let nm = $('#lnkEd .nm').value.trim();
  if (!nm && u) { try { nm = new URL(u).hostname.replace(/^www\./, ''); } catch (e) {} }
  l.name = nm.slice(0, 30);
  touch(); render(); $('#lnkEd').hidden = true; lnkFor = null;
}

function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        ok({ url: cv.toDataURL('image/jpeg', q), w, h });
      };
      im.onerror = no; im.src = fr.result;
    };
    fr.onerror = no; fr.readAsDataURL(file);
  });
}

  e.preventDefault();

  $('#st').textContent = '사진 넣는 중';
  try {

    cur().notes.push({ id: uid(), x: Math.max(0, snap(c.x - w / 2)), y: Math.max(0, snap(c.y - h / 2)), w, h, title: '', text: '', img: im.url, color: 'white', z: topZ() + 1, fs: 13 });

const URL_RE = /(https?:\/\/[^\s<>"']+[^\s<>"'.,)\]}])/g;
function linkify(el) {                                 // 글 속의 주소를 눌러서 들어갈 수 있게 만든다
  let changed = false;
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const hits = [];
  while (walk.nextNode()) {
    const n = walk.currentNode;
    if (n.parentNode && n.parentNode.closest && n.parentNode.closest('a')) continue;
    if (URL_RE.test(n.nodeValue)) hits.push(n);
    URL_RE.lastIndex = 0;
  }
  for (const n of hits) {
    const frag = document.createDocumentFragment();
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(n.nodeValue))) {
      if (m.index > last) frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = m[1];
      frag.appendChild(a); last = m.index + m[1].length;
    }
    if (last < n.nodeValue.length) frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
    n.parentNode.replaceChild(frag, n); changed = true;
  }
  return changed;
}

// 바로가기 타일은 타일 아무 데나, 사진 메모는 사진 위에서도 끌 수 있다.
let drag = null, pend = null, moved = false;
$('#canvas').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const box = e.target.closest('[data-k]'); if (!box) return;
  const k = box.dataset.k, o = find(k, box.dataset.id); if (!o) return;
  const t = e.target;
  if (t.tagName === 'BUTTON' || t.dataset.pal) return;               // 지우기·＋·제목·색 단추
  const rz = t.classList.contains('rz');
  if (!rz) {
    if (t.tagName === 'INPUT' || t.closest('.tx')) return;           // 글자 칸: 글자 선택이 우선
    const canMove = t.closest('.hd') || k === 'l' || (k === 'n' && t.tagName === 'IMG');
    if (!canMove) return;                                            // 제목 줄로만 옮긴다
  }
  const base = { o, box, k, sx: e.clientX, sy: e.clientY, x: o.x, y: o.y, w: o.w, h: o.h };
  if (rz) {
    const dir = ['se', 'sw', 'e', 'w', 's'].find((c) => t.classList.contains(c)) || 'se';
    e.preventDefault(); drag = { ...base, mode: 'rz', dir }; document.body.style.userSelect = 'none';
  }
  else pend = { ...base, mode: 'mv' };
  moved = false;
  if (k === 'l' && sel !== o.id) { sel = o.id; box.classList.add('sel'); }
  if (k === 'n' && sel !== o.id) { sel = o.id; o.z = topZ() + 1; box.style.zIndex = 10 + o.z; box.classList.add('sel'); touch(); }
});
document.addEventListener('mousemove', (e) => {
  if (pend && (Math.abs(e.clientX - pend.sx) > 4 || Math.abs(e.clientY - pend.sy) > 4)) {
    drag = pend; pend = null;
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (err) {}
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    document.body.style.userSelect = 'none'; drag.box.classList.add('mv'); moved = true;
  }
  if (!drag) return;
  e.preventDefault();
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.mode === 'mv') {
    const m = magnet(drag.o, drag.k, drag.x + dx, drag.y + dy);
    drag.o.x = m.x; drag.o.y = m.y;
    drag.box.style.left = drag.o.x + 'px'; drag.box.style.top = drag.o.y + 'px';
  } else {
    const min = drag.k === 'n' ? [80, 60] : [160, 120], d = drag.dir;
    if (d === 'sw' || d === 'w') {                     // 왼쪽 쪽: 오른쪽 끝을 붙잡고 왼쪽으로 늘린다
      const right = drag.x + drag.w;
      let nx = Math.max(0, snap(drag.x + dx)), w = right - nx;
      if (w < min[0]) { w = min[0]; nx = right - w; }
      drag.o.x = nx; drag.o.w = w;
      drag.box.style.left = nx + 'px'; drag.box.style.width = w + 'px';
    } else if (d === 'se' || d === 'e') {              // 오른쪽 쪽
      drag.o.w = Math.max(min[0], snap(drag.w + dx));
      drag.box.style.width = drag.o.w + 'px';
    }
    if (d === 'se' || d === 'sw' || d === 's') {       // 아래쪽
      drag.o.h = Math.max(min[1], snap(drag.h + dy));
      drag.box.style.height = drag.o.h + 'px';
    }
  }
});
document.addEventListener('mouseup', () => {
  pend = null;
  if (!drag) return;
  drag.box.classList.remove('mv');
  if (drag.mode === 'mv') unstack(drag.o, drag.k);
  drag = null; document.body.style.userSelect = ''; touch(); render();
});

let fmtFor = null, fmtRange = null, fmtBusy = false;

function keepSel() {                                   // 창을 눌러도 고른 글자가 풀리지 않게 되살린다
  if (!fmtFor || !fmtRange) return false;
  fmtBusy = true;
  try { fmtFor.focus(); const g = window.getSelection(); g.removeAllRanges(); g.addRange(fmtRange); }
  catch (err) { fmtBusy = false; return false; }
  setTimeout(() => { fmtBusy = false; }, 0);

}
function fmtSize(px) {                                 // 고른 글자만 크기 바꾸기

  try { r.surroundContents(sp); } catch (err) { sp.appendChild(r.extractContents()); r.insertNode(sp); }
  const n = document.createRange(); n.selectNodeContents(sp);
  g.removeAllRanges(); g.addRange(n); fmtRange = n.cloneRange();
}

function ago(t) {
  const m = Math.floor((Date.now() - (t || 0)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60); if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}
function binPv(t) {                                  // 어떤 내용이었는지 보여 주는 작은 미리보기
  const o = t.o || {};
  if (t.k === 'n') {
    const bg = COLORS[o.color] ? COLORS[o.color].bg : '#fde68a';
    if (o.img) return `<div class="pv" style="--pv:${bg}"><img src="${o.img}" alt=""></div>`;
    const txt = (o.text || '').slice(0, 160);
    return `<div class="pv" style="--pv:${bg}">${txt ? esc(txt) : '<span style="opacity:.45">(빈 메모)</span>'}</div>`;
  }
  if (t.k === 'a') return `<div class="pv ico" style="color:var(--text);--pv:${tint(o.color)};border-style:dashed;border-color:${COLORS[o.color] ? COLORS[o.color].bd : '#64748b'}">▭</div>`;
  return `<div class="pv ico" style="--pv:var(--card);color:var(--text)">${o.icon ? esc(o.icon) : (/^mstsc:/i.test(o.url || '') ? '🖥️' : '🔗')}</div>`;
}
function binSub(t) {
  const o = t.o || {}, bits = [];
  if (t.bn) bits.push(esc(t.bn));
  if (t.k === 'n') bits.push(`${o.w || 0}×${o.h || 0}`);
  if (t.k === 'l' && o.url) bits.push(esc(o.url));
  bits.push(ago(t.del));
  return bits.join(' · ');
}
function binName(t) {
  const o = t.o || {};
  if (t.k === 'a') return (o.title || '').trim() || '이름 없는 범위';

  return (o.title || '').trim() || (o.text || '').trim().split('\n')[0].slice(0, 30) || (o.img ? '사진 메모' : '빈 메모');
}

function backupDown() {
  const pad = (n) => String(n).padStart(2, '0');
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const data = { app: 'ims-memo', ver: 1, saved: d.toISOString(), active, boards, trash, prefs };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `IMS-memo-backup-${stamp}.json`;   // 한글 이름은 브라우저가 버리는 경우가 있어 영문으로
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  const n = boards.reduce((m, b) => m + (b.pages || []).reduce((q, g) => q + g.notes.length + g.areas.length + (g.links || []).length, 0), 0);
  $('#st').textContent = `백업 ${n}개`;
}

    const n = j.boards.reduce((m, b) => m + (b.pages || []).reduce((q, g) => q + (g.notes || []).length + (g.areas || []).length + (g.links || []).length, 0), 0);
    const when = j.saved ? new Date(j.saved).toLocaleString('ko-KR') : '시각 모름';
    if (!confirm(`${when} 에 받은 백업입니다.\n메모판 ${j.boards.length}개 · 내용 ${n}개.\n\n지금 메모는 모두 이 백업으로 바뀝니다. 되돌릴 수 없습니다. 계속할까요?`)) return;

  if (!e.target.closest('#bmenu') && !e.target.closest('.bd')) $('#bmenu').hidden = true;
  if (!e.target.closest('#pmenu') && !e.target.closest('.pg')) $('#pmenu').hidden = true;
  if (!e.target.closest('#etc') && !e.target.closest('#addEtc')) $('#etc').hidden = true;
  if (!e.target.closest('#lnkEd') && !e.target.closest('.lnk')) { $('#lnkEd').hidden = true; lnkFor = null; }
});

// ---- 저장 ----
let timer = null;
function touch() { dirty = true; $('#st').textContent = '저장 대기'; clearTimeout(timer); timer = setTimeout(saveNow, 700); }
async function saveNow() {
  if (!dirty || saving) return;
  saving = true; $('#st').textContent = '저장 중';
  const body = JSON.stringify({ boards, active, trash, prefs });
  dirty = false;
  try {
    const r = await fetch('api/memo', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '저장 실패');
    $('#st').textContent = '저장됨';
  } catch (e) { dirty = true; $('#st').textContent = '저장 실패'; }
  saving = false;
  if (dirty) setTimeout(saveNow, 1500);
}
window.addEventListener('beforeunload', () => {
  if (!dirty) return;
  try { fetch('api/memo', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ boards, active, trash, prefs }), keepalive: true }); } catch (e) {}
});
window.addEventListener('resize', render);

// ---- 메모판 탭·도구를 맨 위 탭줄 안으로 (공통 상단바가 그려진 뒤) ----
// 상단바의 "메모" 탭 자리를 메모판 탭(메모 1, 메모 2 …)이 대신한다. 별도 줄을 쓰지 않는다.
(function mountBar() {
  let tries = 0;
  const t = setInterval(() => {
    const tabs = document.getElementById('navtabs');
    const my = tabs && tabs.querySelector('a[data-page="memo.html"]');
    if (my) {
      my.remove();
      tabs.appendChild($('#bds'));
      clearInterval(t); render();
    } else if (++tries > 60) clearInterval(t);   // 상단바가 없으면(창 안에 끼워 쓸 때) 그대로 둔다
  }, 50);
})();

(async () => {
  const r = await fetch('api/memo');
  if (r.status === 401) { location.href = 'login.html'; return; }
  if (r.status === 403) { location.href = 'home.html?denied=memo.html'; return; }
  const j = await r.json();
  boards = j.boards || []; active = j.active || (boards[0] && boards[0].id) || '';
  trash = j.trash || []; if (j.prefs) prefs = { ...prefs, ...j.prefs };
  render();
})();
</script>
</body>
