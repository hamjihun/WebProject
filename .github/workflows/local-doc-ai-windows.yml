name: local-doc-ai Windows installer

on:
  push:
    paths:
      - "local-doc-ai/**"
      - ".github/workflows/local-doc-ai-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: local-doc-ai
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest xlwt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm packaging/local_doc_ai.spec

      - name: Self-test built exe
        run: |
          $env:DOCAI_DATA_DIR = "$env:RUNNER_TEMP\docai-selftest\data"
          $env:OLLAMA_URL = "http://127.0.0.1:1"
          $p = Start-Process -FilePath "dist\LocalDocAI\LocalDocAI.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\docai-selftest\logs\selftest.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\docai-selftest\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (-not (Test-Path "$inno\Languages\Korean.isl")) {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl" -OutFile "$inno\Languages\Korean.isl"
          }
          & "$inno\ISCC.exe" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDocAI-Setup-${{ env.APP_VERSION }}
          path: local-doc-ai/dist-installer/*.exe

      - name: Publish to release "local-doc-ai-latest"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "local-doc-ai-latest"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $notes = "사내 문서 AI 설치 파일 $env:APP_VERSION (브랜치 ${{ github.ref_name }}, 커밋 ${{ github.sha }})`n`n아래 LocalDocAI-Setup-*.exe 를 받아 실행하세요."
          gh release create $tag (Get-ChildItem dist-installer\*.exe).FullName --title "사내 문서 AI $env:APP_VERSION" --notes $notes --target ${{ github.sha }} --prerelease
