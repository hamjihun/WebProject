name: Build Windows exe

on:
  push:
    branches: ["**"]
    paths: ["excel_to_ppt/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: excel_to_ppt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MonthlyPPT --icon app.ico
          --add-data "mapping.json;." --add-data "app.ico;." --add-data "app.png;."
          --collect-all tkinterdnd2 gui.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/MonthlyPPT.exe package/
          Copy-Item mapping.json package/
          Copy-Item README.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: MonthlyPPT-windows
          path: excel_to_ppt/package
          if-no-files-found: error
