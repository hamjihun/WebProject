<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연말 경품 추첨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--line:rgba(255,255,255,.12);--panel:rgba(12,18,48,.72);--gold:#ffd166;--red:#ff4d6d;--text:#f4f6ff;--dim:#9aa3c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif}
body{background:linear-gradient(180deg,#0e1538 0%,#070b1f 100%);background-color:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
#fx{position:fixed;inset:0;pointer-events:none;width:100vw;height:100vh;z-index:1000}
#app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr}
#body{display:grid;grid-template-columns:var(--sw,300px) 1fr;min-height:0;transition:grid-template-columns .25s}
body.side-hidden #body,body.viewer #body{--sw:0px}
#body>main{grid-column:2;min-width:0}
#left>*{min-width:0}
.clock{font-size:1.05vw;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;padding:.3em .8em;border-radius:.5em;background:rgba(255,255,255,.06)}
.hsp{flex:1}
/* 왼쪽 진행 패널 */
#side{min-width:0;overflow:hidden auto;background:rgba(4,7,22,.75);border-right:1px solid var(--line);font-size:14px;display:flex;flex-direction:column}
body.side-hidden #side{visibility:hidden}
.sd-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sd-h{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:8px}
.sd-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sd-tabs .tab{font-size:14px;padding:8px 0}
.sd-title{font-weight:900;font-size:15px;margin-bottom:4px}
.sd-next{color:var(--dim);font-size:13px;margin-bottom:12px;line-height:1.5}
.sd-next b{color:var(--gold)}
#mainBtn{width:100%;font-size:17px;font-weight:900;padding:14px 10px;border:none;border-radius:10px;cursor:pointer;background:#e63950;color:#fff}
#mainBtn:hover{filter:brightness(1.1)}
#mainBtn.gold{background:#ffc233;color:#3a2500}
#mainBtn.pause{background:#3d4a8f}
#mainBtn:disabled{opacity:.5;cursor:default;filter:none}
.sd-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--dim);font-size:13px}
.sd-row .btn{font-size:13px;padding:5px 8px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;line-height:1.5;margin-bottom:8px}
.rec dt{font-weight:700;white-space:nowrap}
.rec dd{margin:0;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.rec dd.ok{color:#80ed99}.rec dd.now{color:var(--gold)}
.sd-roster{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:10px}
.sd-roster b{color:var(--text)}
.sd-roster code{color:var(--gold);font-size:13px}
.sd-roster .warn{color:#ffb3c1}
.btn.wide{display:block;width:100%;text-align:left;font-size:13.5px;padding:9px 12px;margin-top:6px}
.sd-foot{margin-top:auto;padding:12px 16px;font-size:12px;color:var(--dim);line-height:1.6}
#sideToggle{font-size:1.1vw;padding:.35em .6em}
/* 기록 표 */
.logtbl{width:100%;border-collapse:collapse;font-size:13px}
.logtbl th,.logtbl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:top}
.logtbl th{color:var(--dim);font-weight:700;position:sticky;top:0;background:#121a3f}
.logtbl td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--dim)}
.logtbl td.h{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.logwrap{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.verify{padding:8px 12px;border-radius:8px;margin:8px 0 12px;font-size:14px}
.login{width:min(380px,92vw)}
.login label{display:block;font-size:13px;color:var(--dim);margin:10px 0 0}
.login input{display:block;width:100%;margin-top:4px;background:#0a1030;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px}
.lgmsg{min-height:1.4em;margin-top:10px;color:#ffb3c1;font-size:13px}
.verify.ok{background:rgba(128,237,153,.12);color:#80ed99}.verify.bad{background:rgba(255,77,109,.15);color:#ffb3c1}
.bigfont{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}

/* header */
header{display:flex;align-items:center;gap:.9vw;padding:.7vh 1vw .7vh 1.2vw;background:rgba(0,0,0,.4);border-bottom:1px solid var(--line);min-width:0}
.brand{font-size:1.45vw;color:var(--gold);white-space:nowrap}
.tabs,.views{display:flex;gap:.3vw}
.tab,.vbtn{white-space:nowrap;font-size:.9vw;font-weight:900;padding:.42em .85em;border-radius:.6em;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer}
.tab.active,.vbtn.active{background:var(--gold);color:#2b1d00;border-color:var(--gold)}
.vbtn{font-weight:700}
.tab:disabled{cursor:not-allowed}.tab:disabled:not(.active){opacity:.35}
.phase{font-size:1vw;font-weight:900;padding:.32em .85em;border-radius:99px;background:rgba(255,77,109,.18);border:1px solid rgba(255,77,109,.6);color:#ffb3c1;white-space:nowrap}
.phase.final{background:rgba(255,209,102,.16);border-color:var(--gold);color:var(--gold)}
.phase.live{background:rgba(255,0,60,.25);border-color:#ff3355;color:#fff;animation:blink 1.6s infinite}
.viewers{font-size:.85vw;color:var(--dim);white-space:nowrap}
.stats{display:flex;gap:1.1vw;margin-left:auto}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.stat small{font-size:.7vw;color:var(--dim);white-space:nowrap}
.stat b{font-size:1.6vw;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.g{color:var(--gold)}
.stat span{font-size:.75vw;color:var(--dim)}
.controls{display:flex;gap:.35vw;align-items:center}
.btn{font-size:.9vw;padding:.5em .75em;border-radius:.6em;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
select.btn{appearance:none}
select.btn option{color:#000}
body.viewer .host-only{display:none!important}
body.local .server-only{display:none!important}

/* layout */
main{display:grid;grid-template-columns:31vw 1fr;grid-template-rows:1fr;gap:1vw;padding:1vw;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1vw;backdrop-filter:blur(4px)}
#banner{display:none}
#left{display:grid;grid-template-rows:auto 1fr;gap:1vw;min-height:0}
#stage{padding:1.4vh 1.2vw 1.6vh}
.stage-label{font-size:1.15vw;font-weight:900;color:var(--gold);text-align:center;letter-spacing:.05em}
.reel{position:relative;margin:1.2vh 0 1vh;padding:2.6vh .6vw 2.2vh;border-radius:1vw;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:2px solid rgba(255,209,102,.35);box-shadow:inset 0 0 3vw rgba(0,0,0,.55)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:28%;pointer-events:none}
.reel::before{top:0;background:linear-gradient(rgba(5,8,22,.55),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,rgba(5,8,22,.55))}
.rname{font-size:5.4vw;line-height:1.12;letter-spacing:.04em;white-space:nowrap}
.rdept{font-size:1.45vw;color:var(--dim);margin-top:.6vh;font-weight:700;min-height:1.3em}
.reel.spinning{border-color:#fff;box-shadow:inset 0 0 3vw rgba(0,0,0,.55),0 0 2vw rgba(255,255,255,.25)}
.reel.spinning .rname{animation:flick .09s linear infinite}
@keyframes flick{0%{transform:translateY(-12%);opacity:.6}100%{transform:translateY(8%);opacity:1}}
.reel.landed{border-color:var(--red);animation:shake .45s,glowRed 1.6s}
.reel.landed .rname{color:var(--red);text-shadow:0 0 2vw rgba(255,77,109,.6)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.2%)}40%{transform:translateX(1.2%)}60%{transform:translateX(-.7%)}80%{transform:translateX(.7%)}}
@keyframes glowRed{0%{box-shadow:0 0 4vw rgba(255,77,109,.9)}100%{box-shadow:0 0 0 rgba(255,77,109,0)}}
.stamp{position:absolute;right:1vw;top:1.2vh;font-size:2.3vw;color:var(--red);border:.28vw solid var(--red);border-radius:.6vw;padding:0 .6vw;transform:rotate(-14deg) scale(3);opacity:0;z-index:2}
.reel.stamped .stamp{animation:stamp .4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{opacity:.95;transform:rotate(-14deg) scale(1)}}
.rsub{text-align:center;font-size:1.25vw;min-height:1.6em}
.rsub b{color:var(--gold);font-size:1.15em}
.rsub .red{color:var(--red)}
.prog{height:1vh;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:1.2vh}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4d6d,#ffd166);transition:width .6s}
.ptext{display:flex;justify-content:space-between;font-size:1vw;color:var(--dim);margin-top:.6vh;font-variant-numeric:tabular-nums}
.ptext b{color:var(--text)}
.reg{margin-top:1.4vh;text-align:center;font-size:1vw;color:var(--dim);line-height:1.6}
.reg b{color:var(--gold)}
.reg .warn{color:#ffb3c1}
.reg .btn{font-size:1vw;margin-top:.6vh}

#logWrap{display:flex;flex-direction:column;min-height:0;padding:1.2vh 1vw;overflow:hidden}
.log-title{font-size:1.15vw;font-weight:900;color:var(--gold);margin-bottom:.8vh;display:flex;justify-content:space-between}
.log-title span{color:var(--dim);font-weight:400}
#log{list-style:none;margin:0;padding:0;overflow:hidden;flex:1;min-height:0}
#log li{display:grid;grid-template-columns:3.2em 5.6em 1fr auto;gap:.5em;align-items:center;padding:.35em .6em;border-radius:.5em;font-size:1.12vw;border-bottom:1px solid rgba(255,255,255,.05)}
#log li .no{color:var(--dim);font-variant-numeric:tabular-nums}
#log li .nm{font-weight:900}
#log li .dp{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log li .tm{font-size:.78em;color:var(--dim);font-variant-numeric:tabular-nums}
#log li.new{animation:slideIn .6s}
#log li.win{grid-template-columns:auto 1fr auto;background:linear-gradient(90deg,rgba(255,209,102,.22),rgba(255,209,102,.04));margin-bottom:.4em;font-size:1.2vw}
#log li.win .pz{color:var(--gold);font-weight:900}
#log li.win.grand{background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,209,102,.15))}
@keyframes slideIn{0%{transform:translateX(-30%);opacity:0;background:var(--red)}40%{transform:none;opacity:1;background:rgba(255,77,109,.7)}100%{background:transparent}}

/* board */
#boardWrap{padding:.8vw;min-height:0;min-width:0;overflow:hidden}
#board{height:100%;display:flex;gap:.9em;font-size:18px}
.gb{display:flex;flex-direction:column;min-width:0;min-height:0}
.gbh{display:none;align-items:baseline;flex-wrap:wrap;gap:.2em .8em;padding:.1em .3em .4em;margin-bottom:.4em;border-bottom:2px solid rgba(255,209,102,.4);white-space:nowrap;overflow:hidden;min-width:0}
.gbh b{font-size:1.15em;color:var(--gold)}
.gbh .gph{font-size:.8em;padding:.05em .6em;border-radius:99px;border:1px solid rgba(255,77,109,.6);color:#ffb3c1}
.gbh span{font-size:.85em;color:var(--dim)}
.gbh .g{color:var(--gold);font-size:1.15em}.gbh .r{color:var(--red);font-size:1.15em}
.gbh .fp{margin-left:auto;font-size:.7em;font-family:ui-monospace,Consolas,monospace}
.gcols{flex:1;min-height:0;column-width:11.5em;column-gap:.6em;column-fill:auto}
.dept{break-inside:avoid;margin-bottom:.5em;padding:.3em .4em .35em;border-radius:.5em;background:rgba(255,255,255,.045);border-left:.26em solid var(--c)}
.dept.flash{animation:dflash 1.6s}
@keyframes dflash{0%{background:rgba(255,77,109,.45)}100%{background:rgba(255,255,255,.045)}}
.dept.wiped{opacity:.5}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:.4em;font-weight:900;font-size:.9em;line-height:1.2}
.dh em{font-style:normal;font-weight:400;font-size:.75em;color:var(--c);margin-left:.35em}
.dc{font-size:.78em;color:var(--dim);font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.dc b{color:var(--gold);font-weight:900}
.dc i{font-style:normal;color:var(--red);font-weight:700;margin-left:.3em}
.bar{height:.16em;margin:.2em 0 .25em;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .8s}
.chips{display:flex;flex-wrap:wrap;gap:.18em}
.chip{position:relative;display:inline-flex;align-items:center;gap:.28em;padding:.08em .32em;border-radius:.35em;background:rgba(255,255,255,.08);font-size:.8em;line-height:1.4;white-space:nowrap;transition:opacity .8s,background .8s}
.pips{display:inline-flex;gap:.12em}
.pips i{width:.42em;height:.42em;border-radius:50%;background:var(--gold);box-shadow:0 0 .3em rgba(255,209,102,.75);transition:background .5s}
.pips i.x,.pips i.v{background:#4a4f6e;box-shadow:none}
.pips i.w{background:#fff;box-shadow:0 0 .5em #fff}
.chip.dead{opacity:.3}
.chip.dead .nm{text-decoration:line-through;text-decoration-thickness:.12em;text-decoration-color:var(--red)}
.chip.winner{background:linear-gradient(90deg,#ffe08a,#ffb703);color:#3a2500;opacity:1;box-shadow:0 0 .8em rgba(255,209,102,.8)}
.chip.winner::before{content:"🏆";margin-right:-.1em}
.chip.hit{animation:hit 2.6s;z-index:5}
@keyframes hit{0%{background:var(--red);transform:scale(1.6);box-shadow:0 0 1.2em var(--red);opacity:1}25%{transform:scale(1.35);background:var(--red);opacity:1}100%{transform:none}}
.chip.whit{animation:whit 3s;z-index:5}
@keyframes whit{0%{transform:scale(2);box-shadow:0 0 2em #fff}100%{transform:none}}

/* ===== 화면 1: 추첨 화면 ===== */
body.view-draw #boardWrap{display:none}
body.view-draw main{grid-template-columns:1fr}
body.view-draw #left{grid-template-columns:1.8fr 1fr;grid-template-rows:1fr}
body.view-draw #stage{display:flex;flex-direction:column;justify-content:center;padding:3vh 3vw}
body.view-draw .stage-label{font-size:2vw}
body.view-draw .reel{padding:6vh 1vw 5vh;margin:2.5vh 0 2vh}
body.view-draw .rname{font-size:10.5vw}
body.view-draw .rdept{font-size:2.5vw}
body.view-draw .stamp{font-size:4.4vw;right:2vw;top:2vh}
body.view-draw .rsub{font-size:2.1vw}
body.view-draw .prog{height:1.6vh;margin-top:3vh}
body.view-draw .ptext{font-size:1.5vw}
body.view-draw .reg{font-size:1.3vw}
body.view-draw .reg .btn{font-size:1.2vw}
body.view-draw .log-title{font-size:1.6vw}
body.view-draw #log li{font-size:1.45vw;grid-template-columns:2.8em 5.2em 1fr auto}
body.view-draw #log li.win{font-size:1.5vw}

/* ===== 화면 2: 탈락 현황판 ===== */
body.view-board #left{display:none}
body.view-board main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:.8vw}
body.view-board #banner{display:flex}
body.view-board .gbh{display:flex}
body.view-board .chip.dead{opacity:.9;background:rgba(255,77,109,.3);color:#ffc2cd}
body.view-board .chip.hit{animation:hit 4s}
.banner{align-items:center;gap:1.4vw;padding:1vh 1.6vw;border-radius:1vw;background:linear-gradient(90deg,rgba(255,77,109,.22),rgba(12,18,48,.72) 60%);border:1px solid rgba(255,77,109,.45);font-size:1.5vw;white-space:nowrap;overflow:hidden}
.banner .bt{font-weight:900;color:#fff;background:var(--red);padding:.15em .7em;border-radius:.4em;font-size:.85em}
.banner b{font-size:1.6em;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.banner .bd{color:var(--dim)}
.banner .bx{color:var(--gold)}
.banner .bx.red{color:var(--red)}
.banner .bp{margin-left:auto;color:var(--dim);font-size:.85em}
.banner .bp b{font-size:1.2em;font-family:inherit;color:var(--text)}
.banner.win{background:linear-gradient(90deg,rgba(255,209,102,.35),rgba(12,18,48,.72) 60%);border-color:var(--gold)}
.banner.win .bt{background:var(--gold);color:#3a2500}
.banner.win b{color:var(--gold)}
.banner.idle{background:var(--panel);border-color:var(--line)}
.banner.idle .bt{background:rgba(255,255,255,.12)}
.banner.flash{animation:bflash 1.2s}
@keyframes bflash{0%{filter:brightness(2.2)}100%{filter:none}}

/* overlays */
.ov{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(3,5,18,.86);backdrop-filter:blur(6px);cursor:pointer}
.ov.show{display:flex}
.ov h1{margin:0;font-size:6vw;color:var(--gold);text-shadow:0 0 3vw rgba(255,209,102,.5);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.ov p{font-size:2.3vw;margin:2vh 0 0;line-height:1.5}
.ov p b{color:var(--gold)}
.ov p small{font-size:.7em;color:var(--dim)}
.ov .num{font-size:22vw;line-height:1;color:#fff;text-shadow:0 0 4vw rgba(255,77,109,.9)}
.ov .num.go{animation:pop .9s ease-out}
.hint{margin-top:4vh;font-size:1.1vw;color:var(--dim)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.35}}
.final{background:radial-gradient(ellipse at 50% 40%,rgba(40,30,90,.92),rgba(2,3,12,.97) 70%);overflow:hidden}
.spot{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.07) 0 8deg,transparent 8deg 16deg);animation:rot 40s linear infinite;opacity:.5}
.final.won .spot{opacity:1;background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.16) 0 8deg,transparent 8deg 16deg);animation-duration:14s}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.f-in{position:relative}
.f-rank{font-size:1.6vw;color:var(--dim);letter-spacing:.15em}
.f-prize{font-size:5.5vw;color:var(--gold);margin:.5vh 0 3vh;text-shadow:0 0 2vw rgba(255,209,102,.6)}
.f-reel{min-width:56vw;padding:3vh 3vw;border-radius:2vw;border:.3vw solid rgba(255,255,255,.3);background:rgba(0,0,0,.35)}
.f-reel #fName{font-size:11vw;line-height:1.1;white-space:nowrap}
.f-reel #fDept{font-size:2.4vw;color:var(--dim);margin-top:1vh;min-height:1.3em}
.f-reel.spinning #fName{animation:flick .1s linear infinite}
.final.won .f-reel{border-color:var(--gold);box-shadow:0 0 5vw rgba(255,209,102,.7);animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.final.won #fName{color:var(--gold);text-shadow:0 0 3vw rgba(255,209,102,.8)}
.final.won #fDept{color:#fff}
.f-msg{font-size:3.6vw;margin-top:3vh;min-height:1.4em}
.f-msg small{display:block;font-size:.4em;color:var(--dim);margin-top:.6vh}
.final:not(.won) .hint{visibility:hidden}
.final:not(.won) .f-msg{animation:blink 1s infinite}

/* settings */
.modal{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
.modal.show{display:flex}
.modal-in{width:min(1240px,95vw);max-height:93vh;overflow:auto;background:#121a3f;border:1px solid var(--line);border-radius:14px;padding:22px 26px;font-size:15px}
.modal-in h2{margin:0 0 10px;color:var(--gold)}
.modal-in .help{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gbox{border:1px solid var(--line);border-radius:10px;padding:14px;background:rgba(255,255,255,.03)}
.gbox h3{margin:0 0 10px;font-size:17px}

const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(str){
  const msg=new TextEncoder().encode(str),l=msg.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(msg);b[l]=0x80;
  const dv=new DataView(b.buffer),bits=l*8;dv.setUint32(n-4,bits>>>0);dv.setUint32(n-8,Math.floor(bits/4294967296));
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64);
  const rr=(x,r)=>(x>>>r)|(x<<(32-r));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+SHA_K[i]+w[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0}
    H[0]+=a;H[1]+=bb;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  return[...H].map(x=>x.toString(16).padStart(8,'0')).join('');
}

function auditLine(prev,e){return sha256([prev,e.seq,e.at,e.type,e.msg].join('|')).slice(0,16)}
function audit(type,msg){
  if(MODE==='viewer')return;
  const L=S.audit,prev=L.length?L[L.length-1].h:'GENESIS';
  const e={seq:L.length?L[L.length-1].seq+1:1,at:Date.now(),type,msg};e.h=auditLine(prev,e);L.push(e);
}
function verifyAudit(){let prev='GENESIS';for(let i=0;i<S.audit.length;i++){const e=S.audit[i];if(e.seq!==(i?S.audit[i-1].seq+1:e.seq)||auditLine(prev,e)!==e.h)return{ok:false,at:e.seq};prev=e.h}return{ok:true}}

function parseData(txt){
  const out=[];
  for(const raw of String(txt||'').split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const c=(line.includes('\t')?line.split('\t'):line.split(',')).map(s=>s.trim());
    let site,dept,name,n;
    if(c.length>=4){site=c[0];dept=c[1];name=c[2];n=parseInt(c[3],10)}
    else if(c.length===3){site='';dept=c[0];name=c[1];n=parseInt(c[2],10)}
    else continue;
    if(!name||!(n>0))continue;
    out.push({site,dept:dept||'-',name,n:Math.min(n,MAXT)});
  }
  return out;
}
function build(key){
  const rows=parseData(S.groups[key].data);
  const people=[],tickets=[],depts=[],dmap={},sites=[];
  for(const r of rows){
    const dk=r.site+'|'+r.dept;let d=dmap[dk];
    if(!d){if(!sites.includes(r.site))sites.push(r.site);
      d=dmap[dk]={key,idx:depts.length,site:r.site,dept:r.dept,people:[],tickets:[],color:SITE_COLORS[sites.indexOf(r.site)%SITE_COLORS.length]};depts.push(d)}
    const p={key,id:people.length,name:r.name,site:r.site,d,tickets:[]};people.push(p);d.people.push(p);
    for(let i=0;i<r.n;i++){const t={id:tickets.length,no:tickets.length+1,p};tickets.push(t);p.tickets.push(t);d.tickets.push(t)}
  }
  return{people,tickets,depts};
}
function ensureProg(key){
  const P0=S.prog[key];
  if(!P0||!Array.isArray(P0.status)||P0.status.length!==M[key].tickets.length)
    S.prog[key]={phase:'r1',status:new Array(M[key].tickets.length).fill(0),log:[],winners:[],rounds:{}};
  if(!S.prog[key].rounds)S.prog[key].rounds={};
  normalizePhase(key);
}
function normalizePhase(key){
  const P0=S.prog[key],nPrize=prizeList(key).length,alive=aliveIdx(key).length;
  if(P0.phase==='r1'&&r1Count(key)<=0)P0.phase='r2';
  if(P0.phase==='r2'&&r2Count(key)<=0)P0.phase='final';
  if(P0.phase==='final'&&(P0.winners.length>=nPrize||!alive))P0.phase='done';
  if(P0.phase==='done'&&P0.winners.length<nPrize&&alive)P0.phase='final';
}

function expandPrizes(txt){
  const out=[];

    const l=raw.trim();if(!l)continue;
    const mm=l.match(/^(.*?)\s*[x×X*]\s*(\d+)\s*(명|개)?$/);
    if(mm&&mm[1].trim())for(let i=0;i<Math.min(+mm[2],300);i++)out.push(mm[1].trim());

}

function setName(el,txt){el.textContent=txt;el.style.fontSize='';const box=el.parentElement;if(!box)return;const w=box.clientWidth*.92;if(el.scrollWidth>w&&el.scrollWidth>0){const fs=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=Math.max(12,fs*w/el.scrollWidth)+'px'}}
function spin(pool,final,dur,nameEl,deptEl,box,heavy){
  return new Promise(res=>{
    box.classList.remove('landed','stamped');box.classList.add('spinning');
    const t0=performance.now();let last=null;
    (function step(){
      const e=(performance.now()-t0)/dur;
      if(e>=1){setName(nameEl,final.name);deptEl.textContent=fullDept(final.d);box.classList.remove('spinning');res();return}
      let q=pool[rand(pool.length)];if(pool.length>1){let g=0;while(q===last&&g++<10)q=pool[rand(pool.length)]}
      last=q;setName(nameEl,q.name);deptEl.textContent=fullDept(q.d);sfx.tick(heavy);
      setTimeout(step,35+(heavy?460:300)*e*e*e);
    })();
  });
}

/* ---------- 1차 / 2차 탈락 ---------- */
async function eliminateOne(forced){
  const p=P(),mm=m(),alive=aliveList();
  const ti=forced?forced.ti:alive[rand(alive.length)],t=mm.tickets[ti];
  const pool=[...new Set(alive.map(x=>mm.tickets[x].p))];
  const r=forced?forced.r:(p.phase==='r1'?1:2);
  const spinMs=forced?forced.spinMs:Math.round(Math.min(3200,Math.max(600,S.speed*500)));
  if(!forced)emit('elim',{key:S.cur,ti,r,spinMs,at:Date.now()+spinMs});
  $('#stageLabel').textContent=`${S.cur}그룹 ${r}차 탈락자 발표 · ${doneCount()+1}번째`;
  $('#reelSub').innerHTML='&nbsp;';
  await spin(pool,t.p,spinMs,$('#reelName'),$('#reelDept'),$('#reel'),false);
  const at=forced&&forced.at?forced.at:Date.now();
  p.status[ti]=r;p.log.push({t:ti,r,at});
  const rem=aliveCount(t.p);
  audit('탈락',`${S.cur}그룹 ${r}차 ${p.log.filter(e=>e.r===r).length}번째 · 응모권 No.${t.no} · ${t.p.name} (${fullDept(t.p.d)}) · 남은 ${rem}매`);save();
  $('#reel').classList.add('landed','stamped');
  $('#reelSub').innerHTML=(rem?`응모권 No.${t.no} 탈락 · 남은 응모권 <b>${rem}</b>매`:`<b class="red">응모권 모두 소진!</b> 아쉽지만 다음 기회에 😢`)+` <span style="color:var(--dim);font-size:.75em">· ${fmtT(at)}</span>`;
  sfx.out(!rem);
  updChip(t.p);updDept(t.p.d);updGroupHead(S.cur);
  restart(document.getElementById(S.cur+'p'+t.p.id),'hit');restart(document.getElementById(S.cur+'d'+t.p.d.idx),'flash');
  setBanner(`<span class="bt">방금 탈락</span><b>${esc(t.p.name)}</b><span class="bd">${esc(fullDept(t.p.d))}</span><span class="bx${rem?'':' red'}">${rem?`남은 응모권 ${rem}매`:'응모권 모두 소진'}</span><span class="bd">${fmtT(at)}</span>${bannerProgress()}`);
  addLog({t:ti,r,at},p.log.length-1);updateUI();
  emit('sync',{at});
  return spinMs;
}
async function loop(){
  loopAlive=true;
  try{
    while(running){
      if(doneCount()>=target()){running=false;await finishRound();break}
      if(aliveList().length<=1){running=false;break}
      busy=true;updateUI();
      const spinMs=await eliminateOne();
      busy=false;updateUI();
      if(doneCount()>=target()){running=false;updateUI();await sleep(1800);await finishRound();break}
      const t0=performance.now(),gap=Math.max(350,S.speed*1000-spinMs);
      while(running&&performance.now()-t0<gap)await sleep(60);
    }
  }finally{loopAlive=false;busy=false;updateUI()}
}
async function startRound(){
  if(starting)return;
  const r=P().phase==='r1'?1:2;
  if(!loopAlive&&doneCount()===0){
    starting=true;updateUI();
    const now=Date.now();P().rounds[r]={start:now,end:0};
    audit('발표시작',`${S.cur}그룹 ${r}차 탈락자 발표 시작 · ${target()}매 예정 · 생존 ${aliveList().length}매 · 명단 지문 ${fp(S.cur)}`);save();
    const title=`${S.cur}그룹 ${r}차 탈락자 발표`,sub=`응모권 <b>${target()}</b>매가 탈락합니다<br><small>${fmtFull(now)}</small>`;
    emit('countdown',{title,sub});
    await countdown(title,sub);
    starting=false;
  }else if(!loopAlive){audit('재개',`${S.cur}그룹 ${r}차 발표 재개 (${doneCount()}/${target()}매)`);save()}
  running=true;updateUI();
  if(!loopAlive)loop();
}
async function finishRound(){
  const p=P(),n=p.phase==='r1'?1:2;
  const R=p.rounds[n]||(p.rounds[n]={start:0}),cnt=p.log.filter(e=>e.r===n).length;R.end=Date.now();
  audit('발표완료',`${S.cur}그룹 ${n}차 탈락 완료 · ${cnt}매 탈락 · 생존 ${aliveList().length}매 / ${alivePeople(S.cur)}명`);
  p.phase=n===1?'r2':'final';normalizePhase(S.cur);save();emit('state');
  renderBoard();renderLog();updateUI();sfx.round();confetti(180);
  await message(`${S.cur}그룹 ${n}차 탈락자 발표 완료!`,`생존 응모권 <b>${aliveList().length}</b>매 · <b>${alivePeople(S.cur)}</b>명<br><small>${R.start?fmtISO(R.start)+' ~ '+fmtT(R.end):''} · 다음 순서 : ${PHASE_NAME[p.phase]}</small>`);
  resetStage();idleBanner();updateUI();
}

/* ---------- sound ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,at,f2){
  if(!soundOn())return;const c=ac();if(!c)return;
  const t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
  tick:h=>tone(h?700:1500,.04,'square',h?.07:.035),
  out:all=>{tone(320,.45,'sawtooth',.12,0,70);tone(90,.4,'sine',.35);if(all)[392,370,349,294].forEach((f,i)=>tone(f,i===3?.9:.3,'triangle',.16,.35+i*.3))},
  beep:last=>tone(last?1320:880,last?.6:.2,'triangle',.22),
  round:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.35,'triangle',.15,i*.1)),
  fanfare:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?1.4:.18,'triangle',.2,i*.14));tone(262,1.8,'sine',.14,.7);tone(392,1.8,'sine',.1,.7)}
};

/* ---------- canvas: confetti ---------- */
const fxC=$('#fx'),fx=fxC.getContext('2d');
let W=0,H=0;const parts=[];
const CC=['#ffd166','#ff4d6d','#4cc9f0','#80ed99','#ffffff','#b8a1ff','#ff9f1c'];
function resizeCanvas(){W=innerWidth;H=innerHeight;const r=devicePixelRatio||1;fxC.width=W*r;fxC.height=H*r;fx.setTransform(r,0,0,r,0,0)}
function confetti(n,mode){
  for(let i=0;i<n;i++){
    let x,y,vx,vy;
    if(mode==='sides'){const L=i%2===0;x=L?0:W;y=H*.85;vx=(L?1:-1)*(8+Math.random()*14);vy=-(12+Math.random()*16)}
    else{x=W/2+(Math.random()-.5)*W*.25;y=H*.42;vx=(Math.random()-.5)*22;vy=-Math.random()*18-4}
    parts.push({x,y,vx,vy,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:CC[i%CC.length],w:7+Math.random()*8,h:4+Math.random()*6});
  }
}
function frame(){
  fx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.vy+=.38;q.vx*=.985;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;
    if(q.y>H+30){parts.splice(i,1);continue}
    fx.save();fx.translate(q.x,q.y);fx.rotate(q.r);fx.fillStyle=q.c;fx.fillRect(-q.w/2,-q.h/2,q.w,q.h*Math.abs(Math.cos(q.r*2)));fx.restore()}
  requestAnimationFrame(frame);
}

async function restoreState(file){

    if(next[k].changed||old.r1!==g.r1||old.keep!==g.keep||old.prizes!==g.prizes)audit('설정',`${k}그룹 · 1차 ${r1Count(k)}매 / 2차 ${r2Count(k)}매 탈락 / 최종 ${keepOf(k)}매 · 경품: ${[...new Set(prizeList(k))].map(x=>x+'×'+prizeList(k).filter(y=>y===x).length).join(', ')}`);
  }
  save();closeSettings();renderAll();emit('state');

/* ---------- 엑셀 ---------- */
const norm=v=>String(v==null?'':v).replace(/\s+/g,'');
const NAME_RE=/^(성명|이름|성함)$/;
function tablesFromRows(rows){
  const hi=rows.findIndex(r=>(r||[]).some(c=>NAME_RE.test(norm(c))));
  if(hi<0)return[];
  const width=Math.max(...rows.slice(0,hi+1).map(r=>(r||[]).length));
  const top=Math.max(0,hi-2);
  // 머리글이 2~3줄로 나뉜 경우(병합 셀)도 합쳐서 본다
  const H=[];
  for(let i=0;i<width;i++){const toks=[];for(let r=top;r<=hi;r++){const v=norm(rows[r]&&rows[r][i]);if(v&&!/^[\d.,]+$/.test(v))toks.push(v)}H.push(toks)}
  const has=(i,re)=>H[i]&&H[i].some(t=>re.test(t));
  const nameCols=H.map((_,i)=>has(i,NAME_RE)?i:-1).filter(i=>i>=0);
  return nameCols.map((nc,j)=>{
    const lo=j?nameCols[j-1]:-1,up=j<nameCols.length-1?nameCols[j+1]:width;
    const left=re=>{for(let i=nc-1;i>lo;i--)if(has(i,re))return i;return-1};
    const right=re=>{for(let i=nc+1;i<up;i++)if(has(i,re))return i;return-1};
    const dc=left(/^(부서|부서명|팀|팀명|소속부서)$/),sc=left(/^(근무처|회사|회사명|사업장|법인|소속)$/),gc=left(/^(그룹|조|구분)$/);
    let tc=right(/^전체/);if(tc<0)tc=right(/^(응모권|응모권수|매수|수량|티켓|장수)$/);
    const bc_=tc<0?right(/^기본/):-1,ac_=tc<0?right(/^추가/):-1;
    // 표 제목 (예: "A: 일산전자+ISEMM")
    let key=null,title='';
    for(let r=0;r<hi&&!key;r++)for(let i=lo+1;i<=nc&&!key;i++){const mm=String((rows[r]||[])[i]??'').trim().match(/^([AaBb])\s*(그룹)?\s*[:：]\s*(.+)$/);if(mm){key=mm[1].toUpperCase();title=mm[3].trim()}}
    const out=[];let noName=0,capped=0;
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r]||[],name=String(row[nc]??'').trim();
      const num=c=>c<0?0:parseInt(String(row[c]??'').replace(/[^0-9]/g,''),10)||0;
      let n=tc>=0?num(tc):(bc_>=0||ac_>=0)?num(bc_)+num(ac_):1;
      if(!name||NAME_RE.test(norm(name))){if(n>0&&(tc>=0||bc_>=0))noName++;continue}
      if(!(n>0))continue;
      if(n>MAXT){n=MAXT;capped++}
      const clean=v=>String(v??'').trim().replace(/,/g,' ');
      out.push({group:gc<0?'':norm(row[gc]).toUpperCase(),site:sc<0?'':clean(row[sc]),dept:dc<0?'-':clean(row[dc])||'-',name:clean(name),n});
    }
    return{rows:out,hasGroup:gc>=0,key,title,noName,capped,noTicketCol:tc<0&&bc_<0&&ac_<0};
  });
}
async function importFile(file,onlyKey){
  let tables=[];
  try{
    if(!window.XLSX){
      if(!/\.csv$/i.test(file.name)){alert('엑셀 라이브러리(vendor/xlsx.full.min.js)를 불러오지 못했습니다. CSV로 저장하거나 명단을 붙여넣어 주세요.');return}
      const txt=await file.text();tables=tablesFromRows(txt.split(/\r?\n/).map(l=>l.split(l.includes('\t')?'\t':',')));
    }else{
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      for(const n of wb.SheetNames)tables.push(...tablesFromRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false,blankrows:true})));
    }
  }catch(e){alert('파일을 읽지 못했습니다: '+e.message);return}
  tables=tables.filter(t=>t.rows.length);
  if(!tables.length){alert('‘성명’ 열을 찾지 못했습니다. 머리글에 근무처 / 부서 / 성명 / 응모권 열이 있는지 확인해 주세요.');return}
  const out={A:[],B:[]},titles={},notes=[];
  tables.forEach((t,idx)=>{
    if(t.key&&t.title)titles[t.key]=t.title;
    if(t.noName)notes.push(`이름이 비어 있는 행 ${t.noName}개는 제외했습니다.`);
    if(t.capped)notes.push(`응모권이 ${MAXT}매를 넘는 ${t.capped}명은 ${MAXT}매로 맞췄습니다.`);
    if(t.noTicketCol)notes.push('응모권 열이 없는 표는 1인 1매로 처리했습니다.');
    for(const r of t.rows){
      let k=null;
      if(t.hasGroup&&r.group)k=r.group.startsWith('A')?'A':r.group.startsWith('B')?'B':null;
      else if(!t.hasGroup)k=onlyKey&&tables.length===1?onlyKey:(t.key||(idx===0?'A':idx===1?'B':null));
      if(k)out[k].push(r);
    }
  });
  const keys=(onlyKey?[onlyKey]:KEYS).filter(k=>out[k].length);
  if(!keys.length){alert('불러올 명단이 없습니다. 그룹 열 값이 A 또는 B인지 확인해 주세요.');return}
  const msg=[];
  for(const k of keys){
    $(`#s-${k}-data`).value=out[k].map(r=>[r.site,r.dept,r.name,r.n].join(',')).join('\n');
    if(titles[k])$(`#s-${k}-title`).value=`${k}그룹 · ${titles[k]}`;
    msg.push(`${k}그룹: ${out[k].length}명 · 응모권 ${out[k].reduce((a,r)=>a+r.n,0)}매`);
  }
  alert(`엑셀에서 불러왔습니다.\n\n${msg.join('\n')}${notes.length?'\n\n※ '+[...new Set(notes)].join('\n※ '):''}\n\n내용 확인 후 [저장]을 눌러주세요.`);
}
function exportXlsx(){
  if(!window.XLSX){alert('엑셀 라이브러리를 불러오지 못했습니다.');return}
  const aoa=[['그룹','근무처','부서','성명','응모권']];
  KEYS.forEach(k=>{const ta=$(`#s-${k}-data`);parseData(ta?ta.value:S.groups[k].data).forEach(r=>aoa.push([k,r.site,r.dept,r.name,r.n]))});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:6},{wch:12},{wch:16},{wch:12},{wch:8}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');XLSX.writeFile(wb,'lottery_roster.xlsx');
}

/* ---------- 수신 (관람 / 현황판 창) ---------- */
function applyState(st){
  if(!okState(st))return;
  const old=S,snd=S.sound,au=S.audit;S=st;fixState();S.sound=snd;if(MODE==='viewer'&&!st.audit)S.audit=au||[];
  for(const k of KEYS){if(!M[k]||!old||!old.groups||old.groups[k].data!==S.groups[k].data)M[k]=build(k);ensureProg(k)}
  $('#speed').value=S.speed;renderAll();
}
const Q=[];let qBusy=false;
function enqueue(msg){Q.push(msg);if(!qBusy)drain()}
async function drain(){qBusy=true;while(Q.length){const msg=Q.shift();try{await handle(msg)}catch(e){console.error(e)}}qBusy=false}
async function resync(){
  try{
    if(SERVER){const j=await fetch('api/state',{cache:'no-store'}).then(r=>r.json());if(j&&j.state)applyState(j.state)}
    else{const j=localStorage.getItem(LS);if(j)applyState(JSON.parse(j))}
  }catch(e){}
}
// 관리자 화면의 정확한 시각으로 맞춤 (가장 최근 기록 1건)
function adoptTime(at){
  let best=null;
  for(const k of KEYS){const p=S.prog[k];for(const arr of [p.log,p.winners]){const e=arr[arr.length-1];if(e&&(!best||(e.at||0)>(best.at||0)))best=e}}
  const g=S.grandWinners[S.grandWinners.length-1];if(g&&(!best||(g.at||0)>(best.at||0)))best=g;
  if(best)best.at=at;
}
async function handle(msg){
  const d=msg.data||{};
  switch(msg.event){
    case'state':if(msg.state)applyState(msg.state);else await resync();break;
    case'sync':if(d.ck!==ck())await resync();else{if(d.speed)S.speed=d.speed;if(d.at)adoptTime(d.at);updateUI()}break;
    case'elim':
      if(d.ck!==ck())await resync();
      if(S.cur!==d.key||S.prog[d.key].status[d.ti]!==0){renderAll();break}
      busy=true;updateUI();await eliminateOne(d);busy=false;updateUI();break;
    case'countdown':await countdown(d.title,d.sub);break;
    case'msg':await message(d.title,d.sub,d.oid);resetStage();idleBanner();renderLog();updateUI();break;
    case'win':
      if(d.ck!==ck())await resync();
      if(S.prog[d.key].status[d.ti]!==0){renderAll();break}
      await drawWinner(d);break;
  }
}
function onRemote(msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.event==='viewers'){$('#viewers').textContent=`👀 접속 화면 ${msg.data.n}개`;return}
  if(MODE!=='viewer')return;
  if(msg.event==='close'){closedOids.add(msg.data.oid);if(viewerWait&&viewerWait.oid===msg.data.oid){const r=viewerWait.res;viewerWait=null;r()}return}
  enqueue(msg);
}
function connectSSE(){
  const es=new EventSource('api/events');let first=true;
  es.onmessage=e=>{let msg;try{msg=JSON.parse(e.data)}catch(x){return}onRemote(msg)};
  es.onopen=()=>{
    if(MODE==='viewer'&&!first)fetch('api/state',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.state)enqueue({event:'state',state:j.state})}).catch(()=>{});
    first=false;
  };
}
async function detectServer(){
  if(!/^https?:$/.test(location.protocol))return null;
  try{const r=await fetch('api/state',{cache:'no-store'});if(!r.ok)return null;const j=await r.json();return j&&typeof j==='object'&&'state' in j?j:null}catch(e){return null}
}
function openBoardWindow(){
  const u=new URL(location.href);u.search='';u.searchParams.set('view','board');
  u.searchParams.set(SERVER?'viewer':'sync',SERVER?'1':'viewer');
  window.open(u.toString(),'lottery-board');
}

/* ---------- 시작 ---------- */
function onMain(){
  if(closer||starting)return;
  ac();
  const ph=P().phase;
  if(ph==='r1'||ph==='r2'){if(running){running=false;audit('일시정지',`${S.cur}그룹 ${ph==='r1'?1:2}차 발표 일시정지 (${doneCount()}/${target()}매)`);save();updateUI()}else startRound()}
  else if(ph==='final'||inGrand())drawWinner();
}
/* ---------- 관리자 로그인 ---------- */
let authWarned=false;
function authLost(){if(authWarned)return;authWarned=true;running=false;alert('관리자 로그인이 만료되었습니다. 다시 로그인해 주세요.');location.reload()}
function openLogin(){$('#lgMsg').textContent='';$('#loginModal').classList.add('show');setTimeout(()=>$('#lgUser').focus(),50)}
async function doLogin(e){
  e.preventDefault();$('#lgMsg').textContent='확인 중…';
  try{
    const r=await fetch('api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('#lgUser').value.trim(),pw:$('#lgPw').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){const u=new URL(location.href);u.searchParams.delete('viewer');location.href=u.toString();return}
    $('#lgMsg').textContent=j.msg||'로그인에 실패했습니다.';$('#lgPw').value='';
  }catch(x){$('#lgMsg').textContent='서버에 연결할 수 없습니다.'}
}
async function doLogout(){
  if(running||busy||loopAlive){alert('진행을 일시정지한 뒤 로그아웃해 주세요.');return}
  await fetch('api/logout',{method:'POST'}).catch(()=>{});location.reload();
}
function toggleSide(force){
  const hide=force!=null?force:!document.body.classList.contains('side-hidden');
  document.body.classList.toggle('side-hidden',hide);
  try{localStorage.setItem('lottery-side',hide?'1':'0')}catch(e){}
  setTimeout(fitBoard,320);
}
function toggleFS(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
async function init(){
  load();
  const srv=await detectServer();
  if(srv){
    SERVER=true;
    const me=await fetch('api/me',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}));
    MODE=me.admin&&!FORCE_VIEW?'host':'viewer';
    if(okState(srv.state)){const snd=S.sound;S=srv.state;fixState();S.sound=snd}
  }else if(QS.get('sync')==='viewer')MODE='viewer';
  KEYS.forEach(k=>{M[k]=build(k);ensureProg(k)});save();
  document.body.classList.add('view-'+VIEW);
  if(!SERVER)document.body.classList.add('local');
  if(MODE==='viewer'){document.body.classList.add('viewer');$('#ovHint').textContent='진행자가 곧 다음 순서로 진행합니다';$('#fHint').textContent='진행자가 곧 다음 순서로 진행합니다'}
  if(SERVER||MODE==='viewer')$('#liveBadge').hidden=false;
  if(SERVER)connectSSE();
  else if(MODE==='viewer'&&bc)bc.onmessage=e=>{let msg=e.data;if(typeof msg==='string'){try{msg=JSON.parse(msg)}catch(x){return}}onRemote(msg)};
  if(MODE==='host'&&!okState(srv.state))emit('state');

  const sp=$('#speed');[1,1.5,2,2.5,3,3.5,4,5,6,8,10].forEach(s=>sp.insertAdjacentHTML('beforeend',`<option value="${s}">${s}초</option>`));
  if(![...sp.options].some(o=>+o.value===+S.speed))sp.insertAdjacentHTML('beforeend',`<option value="${S.speed}">${S.speed}초</option>`);
  sp.value=String(S.speed);sp.onchange=()=>{S.speed=+sp.value;audit('설정',`발표 간격 ${S.speed}초/매`);save();updateUI();sp.blur();emit('sync')};
  $('#mainBtn').onclick=e=>{e.currentTarget.blur();onMain()};
  $('#soundBtn').onclick=e=>{e.currentTarget.blur();if(MODE==='viewer'){viewerSound=!viewerSound;ac()}else{S.sound=!S.sound;save()}updateUI()};
  $('#fsBtn').onclick=e=>{e.currentTarget.blur();toggleFS()};
  $('#setBtn').onclick=e=>{e.currentTarget.blur();openSettings()};
  $('#winBtn').onclick=e=>{e.currentTarget.blur();openBoardWindow()};
  $('#logBtn').onclick=e=>{e.currentTarget.blur();openLog()};
  $('#loginBtn').hidden=!(SERVER&&MODE==='viewer'&&!FORCE_VIEW);$('#logoutBtn').hidden=!(SERVER&&MODE==='host');
  $('#loginBtn').onclick=e=>{e.currentTarget.blur();openLogin()};$('#logoutBtn').onclick=doLogout;
  $('#loginForm').onsubmit=doLogin;$('#lgCancel').onclick=()=>$('#loginModal').classList.remove('show');
  $('#sideToggle').onclick=e=>{e.currentTarget.blur();toggleSide()};
  try{if(localStorage.getItem('lottery-side')==='1')document.body.classList.add('side-hidden')}catch(e){}
  const tick=()=>{$('#clock').textContent=fmtFull(Date.now())};tick();setInterval(tick,1000);
  $$('.vbtn').forEach(b=>b.onclick=()=>{b.blur();if(VIEW!==b.dataset.v)setView(b.dataset.v)});
  $$('.tab').forEach(t=>t.onclick=()=>{t.blur();if(t.disabled||S.cur===t.dataset.g)return;S.cur=t.dataset.g;save();renderAll();emit('state')});
  $('#ov').onclick=()=>closer&&closer();$('#finalOv').onclick=()=>closer&&closer();
  addEventListener('keydown',e=>{
    if(e.key==='f'||e.key==='F'||e.key==='ㄹ'){if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))toggleFS();return}
    if(MODE==='viewer'){if(e.key==='Escape')$('#loginModal').classList.remove('show');return}
    if($('#logModal').classList.contains('show')){if(e.key==='Escape')$('#logModal').classList.remove('show');return}
    if($('#setModal').classList.contains('show')){if(e.key==='Escape')closeSettings();return}
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter'){e.preventDefault();if(closer)closer();else onMain();return}
    if(e.key==='Escape'&&closer)closer();
    if(e.key==='h'||e.key==='H'||e.key==='ㅗ')toggleSide();
  });
  let rt;addEventListener('resize',()=>{resizeCanvas();clearTimeout(rt);rt=setTimeout(fitBoard,150)});
  resizeCanvas();requestAnimationFrame(frame);
  renderAll();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBoard);
  window.__lottery={get S(){return S},M};
}
init();
})();
